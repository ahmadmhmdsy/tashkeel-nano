# SIBLING BRANCH, not part of the nano1p1m path. e69_c4_ctx256 and
# e70_c4b_ctx256 are two continuations of the same parent on the same ctx-256
# bed; nano1p1m warm-starts from e69's final, not from this run. This branch is
# what the older "deployed gold" soup (uniform mean of e70's step probes,
# 20.08 registered gate mean) was built from, and it is kept here because the
# E-073/E-075 decode comparisons are recorded against it.
accum: 1
batch_size: 64
early_stop_patience: 12
eval_every: 5000
gate_eval_every: 5000
gate_probe_batch: 256
log_every: 100
lr: 0.0002
model:
  ctx: 256
  ffn: 256
  hidden: 64
  layers: 18
  n_heads: 8
  n_kv: 2
optimizer: adamw
phase: e70_c4b_ctx256
pretrained_init: runs/e69_c4_ctx256/final/model.pt
save_every: 100
tokens_phase: v3ctx256
total_steps: 60000
weight_decay: 0.1

# tashkeel-nano-4p5m - the exact configuration that produced the published
# ahmadsy/tashkeel-nano-4p5m checkpoint (internal id e63s_s4_12l160).
#
# 12L / 160 hidden / 640 ffn / 8 heads / 2 kv, bidirectional, ctx 128.
# 20,000 steps on the v3 token phase, warm-started from stage1lm.
# The published checkpoint is step 19,500, chosen by best validation loss
# (0.17575) - not the last step.
#
# Reproduce:
#   python scripts/download_data.py --config configs/data.yaml --accept-license
#   python scripts/prepare_data.py
#   python scripts/tokenize_data.py --phase v3
#   python scripts/prep_rawlm.py
#   python scripts/train_lm.py --config configs/stage1_lm.yaml
#   python scripts/train.py    --config configs/nano4p5m.yaml
#
# DECODING NOTE: the published package emits shadda-first (pre-NFC) marks and
# uses a non-overlapping ctx-128 chunked decode. That is recorded in
# tashkeel_nano.inference.PRESETS and in docs/evaluation.md; it is a property of
# the published artifact, not of this training config.
accum: 1
batch_size: 32
early_stop_patience: 24
eval_every: 500
gate_eval_every: 500
gate_probe_batch: 128
log_every: 100
lr: 0.0002
model:
  ctx: 128
  ffn: 640
  hidden: 160
  layers: 12
  n_heads: 8
  n_kv: 2
optimizer: adamw
phase: e63s_s4_12l160
pretrained_init: runs/stage1lm/final/model.pt
save_every: 500
seed: 777
tokens_phase: v3
total_steps: 20000
weight_decay: 0.1

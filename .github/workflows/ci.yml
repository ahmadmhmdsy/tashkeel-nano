name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the CPU torch wheel first
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the rest
        run: python -m pip install -r requirements.txt pytest

      - name: Show the data catalog
        run: python scripts/download_data.py --list

      - name: Selftest phases (a0b is SKIPPED without data)
        run: python scripts/selftest.py --phase all

      - name: Test suite
        run: python -m pytest -q

      - name: Demo helper tests (the Gradio app’s own scripts)
        run: |
          python demo/gradio/tests/test_splitter.py
          python demo/gradio/tests/test_scoring.py
          python demo/gradio/tests/test_registry.py

      - name: Inference smoke test on the shipped packages
        run: |
          python scripts/infer.py --run models/nano1p1m --config training_config.yaml \
            --text "السلام عليكم ورحمة الله"
          python scripts/infer.py --run models/nano4p5m --config training_config.yaml \
            --text "السلام عليكم ورحمة الله"

      - name: Config shapes
        run: python scripts/count_params.py

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No file may exceed GitHub's 100 MB plain-file limit
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +100M -print)
          if [ -n "$big" ]; then echo "over 100 MB:"; echo "$big"; exit 1; fi
          echo "largest tracked file:"
          find . -path ./.git -prune -o -type f -printf '%s %p\n' | sort -rn | head -5

      - name: No data, runs or caches may be committed
        run: |
          bad=$(git ls-files | grep -E '^(data|runs|out|scratch)/|__pycache__|\.pyc$|models/[^/]+/(weights|soup_members)/' || true)
          if [ -n "$bad" ]; then echo "should not be committed:"; echo "$bad"; exit 1; fi
          echo "tracked file count: $(git ls-files | wc -l)"

      - name: Every python file compiles
        run: python -m compileall -q src scripts experiments tests demo

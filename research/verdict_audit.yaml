defect_classes:
  D-1: "metric-set ambiguity: 3-gate vs 4-gate means unlabelled"
  D-2: "label-smoothing raises the val_loss floor; val_loss not comparable across arms"
  D-3: "gate-CSV schema drift (legacy phase,src,der vs modern step,gate,DER)"
  D-4: "unclosed runs: no summary.json and no final/ proves the process was killed"
  D-5: "evidence-path fragility: scratch/ and gitignored runs/"
  D-6: "INVERTED metric direction (most damaging)"
  D-7: "wrong or naive baseline (false-negative engine)"
  D-8: "slice-vs-full scoring pads missing prediction lines as errors"
  D-9: "train-vs-test metric confusion"
  D-10: "overclaim against the pre-registered bar"
  D-11: "artifact overwrite / console-only evidence"
  D-12: "silent warm-start no-op: a shape-mismatched pretrained_init loads 0 tensors, the run random-inits while config/report/registry all claim a warm start"
  D-13: "PAD-convention drift on rebuild: ids match byte-for-byte but labels differ at PAD (-1 vs 0); a documented open hazard that fired 2026-10-06 on the first bed built after the doc"
  D-14: "rebuild command does not reproduce its registered bed: --max-train truncates BEFORE the shuffle (wrong row set) and touches train only (silently wrong val split)"

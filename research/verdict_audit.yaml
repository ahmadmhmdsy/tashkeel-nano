structural_findings:
  - "E-31..E-55 are absent from research/experiments.yaml (only diacritizer/E-061 and E-063 rows exist)"
  - "research/EXPERIMENTS.md reuses E-40..E-59 ids across the mex/mu line and the DA/langid line - id-keyed attribution is ambiguous"
  - "deployed gold stage2b2500 is 30.1M params at 3-gate 0.4264; the 1.08M E-070 C4b beats it by 5.2 DER (12.1%), E-068 C1 by 4.4 DER (10.3%), and E-065 F2 by 2.9 DER"
  - "P6 sliding-window voting (E-071) is a FREE inference-only lever: -1.34% on the 3-gate mean (0.374712 -> 0.369702), every gate improving, McNemar p<=3.2e-11, non-degenerate; it is a deterministic transform of whatever weights it is handed, so the PROCEDURE ships with the checkpoint rather than being a new checkpoint"
  - "best-of-run over noisy gate probes was NOT selecting noise here: E-072 tested the gate-best step on the held-out abdou control (41,378 words, never used for selection) and the ordering reproduced exactly (15000 < 40000 < 60000, McNemar p=4.8e-12 / p<1e-300). The top-two ranking is nevertheless METRIC-DEPENDENT - step 40000 leads der_canonical (0.2335 vs 0.2371) and macro_f1 (0.7340 vs 0.7285) while step 15000 leads the registered DER"
  - "ctx 256 is a CONFIRMED lever that composes: P9 +4-6% on the trial bed, C4 -3.4..-4.5% and C4b -6.49% vs C1 at matched tokens (both at 16384 tokens/step). What does NOT compose is unlimited budget - past ~75000 combined steps the gate curve plateaus while val_acc keeps rising, so val_acc is not a proxy for gate rank at fixed budget"

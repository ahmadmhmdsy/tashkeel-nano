  - {system: "E-071 P6 vote e70_c4b_ctx256@15000+vote(w256/s128)", params_m: 1.08, mean3: 0.3697, note: "NEW PROJECT BEST; inference-only sliding-window majority voting over the C4b weights - free, deterministic, no retraining; -1.337% vs the same weights single-pass (0.374712), every gate improves (fadel -1.850, sadeed25 -1.262, wikinews2014 -1.050), paired McNemar p<=3.2e-11, non-degenerate; der_canonical improves MORE (-2.5..-4.0%); the PROCEDURE ships WITH the weights; scope is window 256/stride 128 (ctx-matched), 128/64 not run"}

          -> KILL at +61.4 percent relative at step 300 (and +108 percent at step 0),
          far beyond the +2 percent KILL bar. The control is the same anchor without
          the causal mask, so this isolates the mask, not the optimizer.
      (b) Wall clock, identical conditions, one process, warmup + 3 reps, GPU at
          P8 / 300 MHz during the whole probe (the clock latch, ~9.2 W), so ABSOLUTE
          latencies are inflated by the downclock but the RATIO is a same-condition
          structural comparison:
            T     parallel 1 pass   T sequential steps   slowdown
            128   0.0487 s          5.5119 s             113.2x
            256   0.0393 s         10.5281 s             268.1x
            512   0.0366 s         18.8520 s             515.2x
          The parallel pass is essentially FLAT in T (0.037-0.049 s across 128-512
          positions, so per-position cost falls 380 -> 71 us); the AR cost grows
          LINEARLY in T at ~37-43 ms per token. The multiplier is therefore not a
          constant: it scales with sentence length, which is exactly the corpus
          property the task is hardest on (see E-085: sentences over 256 chars are
          30-38 percent of the gates and 63 percent of abdou, and carry 60-93 percent
          of all scored characters).
    evidence: >-
      runs/diac/_screen_out/ar_speed_probe.json
      runs/diac/_screen_out/ (E-084 bed calibration artifacts)
    finding: >-
      CLOSED 2026-10-11. VERDICT rejected, on BOTH axes, with the accuracy claim
      SCOPED so it is not over-read.
      WHAT IS ESTABLISHED. (1) SPEED is structural and decisive: any left-to-right
      AR decoder on this model pays 113x to 515x the wall clock of the single
      parallel bidirectional pass, and the factor grows with sentence length because
      the AR step count is O(T) while the parallel pass is one forward. This holds
      for ANY AR decoder regardless of architecture - it is not a calibration
      artifact. (2) The CHEAP way to obtain an AR arm - masking an existing
      bidirectional checkpoint - is KILLED at +61.4 percent by the calibrated bed,
      i.e. catastrophically, and that screen is paired against the same anchor
      without the mask.
      WHAT IS NOT ESTABLISHED, stated plainly. The warm-start screen does NOT settle
      a FROM-SCRATCH causal model: a model that trains with the mask from step 0
      never learns to depend on the right context it cannot see, so it would not pay
      this +61 percent. That arm remains UNRUN and is BLOCKED on training budget: it
      needs a real multi-hour run, not a few-minute screen, because the bed's whole
      design is warm-start-vs-anchor and a from-scratch run at 300 steps would be
      compared against an anchor with an unbridgeable head start. The repository's
      own prior is consistent with this caution - the causal stage-1 char LM
      warm-start was negative at 272h and 128h and positive only at 64h.
      WHY IT IS STILL REJECTED RATHER THAN LEFT OPEN. The cost is paid on every
      token of every sentence, and the accuracy prior is against it: diacritization
      is a case-ending-heavy task where 24 percent of case-ending errors are
      long-distance (documented in the diacritization generalization plan), which is
      precisely the information a causal mask deletes. A literature scan this phase
      found no primary source testing a critic-feedback loop on Arabic
      diacritization at all. Spending the one protected GPU training job on an arm
      that must beat a 0.346827 vote-soup best while paying a 100x+ decode tax and
      discarding right context is not a defensible allocation.
      CONSEQUENCE FOR THE PROGRAM: the AR/causal axis is closed as a CANDIDATE for
      the final model. If it is ever reopened it must be a from-scratch trained run
      with its own pre-registration, not a warm-start screen.

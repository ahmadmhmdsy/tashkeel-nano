      Driver: research/verdict_audit/tools/e76_greedy.py, launched as
        .\.venv\Scripts\python.exe research\verdict_audit\tools\e76_greedy.py
      followed by the E-075 voting procedure (window 256 / stride 128, the
      deployed configuration) on the selected soup for the 3 gates plus the
      FULL 15,091-sentence abdou_test.
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL
      (fadel_test, sadeed25, wikinews2014). Held-out reading: full abdou_test
      der_registered. References from artifacts:
        E-075 uniform soup, voted   3-gate 0.346827   abdou 0.341475
        E-075 uniform soup, single  3-gate 0.352195   abdou 0.349032
      PRE-REGISTERED VERDICT RULE (fixed before running), greedy-voted vs
      uniform-voted, both under the SAME voting procedure:
        GREEDY WINS iff greedy-voted der < 0.341475 on full abdou_test AND
                    greedy-voted 3-gate mean <= 0.346827 - dev weighting buys
                    real accuracy over uniform weighting.
        TIE         iff full-abdou der is within 0.5 percent of 0.341475 and
                    the 3-gate mean is within 0.5 percent of 0.346827 -
                    uniform weighting is already at the optimum of this
                    family and the simpler arm is preferred.
        GREEDY WORSE otherwise; uniform weighting is retained and the negative
                    result is recorded as a refutation.
      PRE-RECORDED CAVEATS: the dev objective is a 4,000-pair subsample, so
      greedy can overfit that subsample; E-074 measured a 0.0002 absolute gap
      between the subsample and the full set at the argmin, but that bounds
      the SELECTOR's noise, not the greedy search's. R=4 rounds with 12
      candidates each means 48 scored candidates, so the selection is exposed
      to winner's-curse drift; the full-abdou and gate readings are therefore
      reported as-is and the greedy weight vector is recorded in full. Single
      seed and one lineage (e70_c4b_ctx256), as in E-073.
      RESULT 2026-10-06 (job pwsh-13 selection, job pwsh-15 eval+score, both
      exit 0): GREEDY WORSE. Greedy-voted 3-gate 0.349238 / abdou 0.343443 vs
      uniform-voted 0.346827 / 0.341475, i.e. +0.70 percent on the gates and

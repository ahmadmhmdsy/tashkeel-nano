            20-plus directional rules written with PHYSICAL properties (border-left,
            padding-left, text-align:left, margin-left, inset-left, box-shadow offsets).
            Under dir=rtl those silently stay on the wrong side, so the work was converted
            to LOGICAL properties (border-inline-start, padding-inline-start,
            text-align:start/end, inset-inline-start, margin-inline-start,
            border-start-end-radius) plus explicit flips for the two box-shadows, which
            have no logical form.

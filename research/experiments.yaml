    finding: >-
      CLOSED 2026-10-11. EXACT full-corpus inference measurement, NOT a screen.
      RESULT. Arm: the E-075 soup decoded by diacritizer/scripts/e67_p6_vote.py
      --window 512 --stride 256. Baseline READ FROM DISK: the deployed E-075 voted
      arm at window 256 / stride 128.
        corpus         arm        baseline   rel
        fadel_test     0.268845   0.267606   +0.463 pct
        sadeed25       0.367841   0.366991   +0.232 pct
        wikinews2014   0.410697   0.405884   +1.186 pct
        wikinews2024   0.520629   0.520723   -0.018 pct
        abdou_test     0.347666   0.341475   +1.813 pct
        GATE MEAN3     0.349128   0.346827   +0.663 pct
      PRE-REGISTERED RULE APPLIED: worse on BOTH the 3-gate mean and abdou_test ->
      FALSIFIED. The longer voting window is REJECTED; window = ctx (256) stays.
      INSTRUMENT CHECK PASSES: the baseline readings recovered from
      runs/diac/e75_vote/ reproduce the recorded E-075 numbers EXACTLY - gate mean

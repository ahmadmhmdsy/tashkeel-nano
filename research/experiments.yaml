      - "003"
    notes: >-
      Pre-registered BEFORE launch. Closes the two gaps that made core/E-002
      honestly un-ready: three of four catalogue suites were unreachable by any
      run, and external_gates passed trivially while copying the internal
      reports and relabelling them as external verification. Registered gates now
      re-derive the run claims from the published bytes: artifact_integrity

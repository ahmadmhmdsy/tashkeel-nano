  - id: core/E-001
    scope: core
    status: closed
    question: Does the V2 R1 pipeline complete all thirteen stages on a real consumer GPU (cuda:0, Quadro RTX 3000), advancing the update path end to end (loss moves, a checkpoint is published, metrics land, and the run marker binds)?
    verdict: accepted
    owner: UNKNOWN
    dates:
      created: "2026-09-26"
      started: "2026-09-26"
      closed: "2026-09-26"
    arms:
      - id: gpu-smoke
        config: pipeline_v2/configs/experiments/gpu_smoke.yaml
        gates:
          - "run status is PASS with all thirteen R1 stages in completed_stages"
          - "preflight report has mode gpu and gpu_touched true, taken immediately before launch"
          - "train record shows a finite loss that decreased from its first recorded step"
          - "a checkpoint is published at the final step with a completion marker"
          - "internal evaluation writes a metrics artifact and every declared suite passes"
          - "publish_final writes COMPLETE.json binding the certified payloads"
    metric_source: runs/v2/core/gpu_smoke/internal_evaluation/evaluations/COMPLETE.json
    gpu_window_estimate: "under 5 minutes at the registered micro-model size; single job, no co-run"
    hardware_measured: "Quadro RTX 3000, 6 GiB dedicated VRAM, 5976883200 bytes free at 2026-09-26T06:00:19Z, 0 percent utilisation, 53 C, driver 580.92, CUDA 13.0"
    evidence:
      - pipeline_v2/configs/experiments/gpu_smoke.yaml
      - runs/v2/core/gpu_smoke/status.json
      - runs/v2/core/gpu_smoke/gpu_preflight/attempt/preflight.json
      - runs/v2/core/gpu_smoke/train/checkpoints/COMPLETE.json
      - runs/v2/core/gpu_smoke/internal_evaluation/evaluations/COMPLETE.json
      - runs/v2/core/gpu_smoke/publish_final/COMPLETE.json
      - docs/acceptance.md
    report: docs/acceptance.md
    supersedes: []
    aliases:
      - E-001
      - "001"
    notes: >-
      ACCEPTED for the registered smoke scope, which covers ONLY this config, this
      fixture corpus, and this code path. All six registered gates passed on the
      Quadro RTX 3000: 13/13 stages PASS (runs/v2/core/gpu_smoke/status.json);
      preflight report mode gpu, gpu_touched true, 5352980480 free bytes
      (gpu_preflight/attempt/preflight.json); train 84 steps, loss 3.3634 ->
      0.0871, all finite, final checkpoint step-00000084 published
      (train/checkpoints/COMPLETE.json, train/logs/metrics/segment-000001.jsonl);
      evaluation wrote val_loss 0.6497, val_perplexity 1.9149
      (internal_evaluation/evaluations/COMPLETE.json); publish_final bound three
      certified payloads (publish_final/COMPLETE.json). A repeat run is a no-op
      PASS. run_id is identical across identity, train, and evaluation records.
      A FIRST LAUNCH FAILED and the failure is kept, not deleted:
      runs/v2/core/gpu_smoke-failed-fp16-step2. The GPU path worked (run_started
      device cuda:0, step 1 loss 3.3634, a real checkpoint at step 1) and then
      the loss went non-finite at step 2, because the stage downcast the master
      weights to fp16. Fixed by keeping fp32 master weights and optimizer state
      on every device and running the forward pass under autocast; the declared
      precision still governs the published artifact. That is a code change, so
      per OPERATIONS.md smoke validity the earlier failure does not share this
      verdict.
      LIMITS, stated because they matter: this is a ~2.6M parameter micro model
      on a 24-row fixture corpus, sized to fit 6 GiB. It is NOT the 7B
      r1-consumer profile in configs/base/r1.yaml, which was not attempted and
      would not fit this card. There is no anchor for the core line, so no
      performance or quality claim is made. No external gate ran
      (EXTERNAL_GATE_NAMES is still empty). Learning rate and epoch count remain
      named constants in the stage, not config fields. Both are now config:
      train.learning_rate and train.max_steps, with retention and resume alongside
      them. Superseded in part by core/E-002.

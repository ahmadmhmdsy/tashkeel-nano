            model output; only strings change. The English run was re-measured against the
            E-105 baseline to prove it, rather than assumed unchanged.
        (4) DETECTION, THEN PERSISTENCE, THEN DEFAULT. localStorage, then
            navigator.languages, then English. Resolution runs in an inline head script so
            lang and dir are set BEFORE first paint; a post-load switch flashes the wrong
            direction on every visit.

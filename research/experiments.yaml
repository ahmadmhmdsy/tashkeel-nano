      bundle". The published cards state a size/quality claim that a reader cannot run.
      Build a public interactive Space where our 1.08 M model and third-party models
      diacritize the same text side by side, plus a bulk path for long documents.
    preregistration: >-
      Recorded as a BUILD action, not a hypothesis test: no GPU training, no new model, no
      new claim about the D-line. What was fixed BEFORE building:
        (1) THE ROSTER, by result and not by preference. Four models, three default-on:
            tashkeel-nano-1p1m (ours, 1.08 M, centered window, NFC), tashkeel-nano-4p5m
            (ours, 4.49 M, hard chunks, pre-NFC), flokymind/mishkala (12.5 M, NFC), and
            Abdou/arabic-tashkeel-flan-t5-small (77 M, pre-NFC, slow, default-off).
            Excluded AFTER probing, each with a recorded reason: Tashkeel-50M (degenerate
            repetition loop), Fine-Tashkeel (ByT5; correct but 307.47 s per sample),
            Tashkeel-v4 (gated), Tashkeel-v3 (needs trust_remote_code, 16.07 s).
        (2) THE HONESTY RULE for a static host, written before the UI: a static Space
            cannot run a Python dependency, so only the two ONNX models run live and every
            precomputed column must be labelled "precomputed" in the UI and in prose; and

  - id: diacritizer/E-077
    scope: diacritizer
    status: closed
    question: >-
      E-075 composed the E-073 weight soup with sliding-window voting at
      window 256 / stride 128 and took the registered gate mean to 0.346827.
      But 256 IS the model's ctx (runs/diac/e67_gen/c4b_ctx256.yaml), and
      window_starts() returns a SINGLE window for every sentence of 256 chars
      or fewer (diacritizer/scripts/e67_p6_vote.py:41-42) - so the vote is a
      literal no-op on those sentences. E-075's -1.52 percent therefore comes
      only from the longer sentences and is BOUNDED BY window == ctx. Question:
      does shrinking the window below ctx - which mechanically raises the
      number of independent contexts each position is voted from - buy more
      accuracy, or does the lost per-window context cost more than the extra
      votes pay?
    verdict: rejected
    owner: agent
    dates:
      created: "2026-10-06"
    depends_on:
      - diacritizer/E-075
      - diacritizer/E-073
    arms: >-
      No training. The SAME checkpoint as E-075, runs/diac/e73_soup/c4b_uniform,
      under the same config runs/diac/e67_gen/c4b_ctx256.yaml, swept over
      window/stride:
        W256/128   READ from E-075, not re-run (the deployed setting)
        W192/96    new
        W128/64    new
      Driver: diacritizer/scripts/e67_p6_vote.py --window <w> --stride <s> for
      <corpus> in fadel_test, sadeed25, wikinews2024, wikinews2014, abdou_test.
      PROPERTY OF THE DRIVER, VERIFIED BY READING THE SOURCE RATHER THAN
      ASSUMED: --window affects ONLY the voted arm. The single arm is produced
      by B.predict_bares over the full ctx (e67_p6_vote.py:149), so the E-075
      single numbers are invariant under this sweep and the vote/single
      contrast stays clean. Both arms are re-emitted from one loaded model per
      run, so E-075's built-in control property is preserved.
      Every window is strictly <= ctx, so no arm exceeds the model's trained
      context.
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL
      (fadel_test, sadeed25, wikinews2014), LOWER IS BETTER. Held-out reading:
      abdou_test der_registered. Reference from artifacts: E-075 voted soup
      3-gate 0.346827 / abdou 0.341475 at W256/128.
      PRE-REGISTERED VERDICT RULE (fixed before running). The window is
      SELECTED on abdou_test dev, never on the registered gates, so the gates
      stay a score-once measurement (rules/experiments.md, selection is not
      measurement):
        WIN       iff the best non-256 window beats W256/128 on abdou_test by
                  >= 1 percent relative AND that same arm's 3-gate mean is
                  <= 0.346827 - the window was leaving accuracy on the table
                  and the bound is real.
        PARTIAL   if the best non-256 window beats W256/128 on abdou_test by
                  under 1 percent relative - a real but marginal gain.
        FALSIFIED if no non-256 window beats W256/128 on abdou_test - the
                  deployed window is already optimal for this family.
      REPORTING RULE: all arms are printed on all five corpora as diagnostics,
      but the REGISTERED claim is only the abdou-selected arm's 3-gate number,
      and it is reported once. Picking the gate-best window post hoc would be
      a second selection double-dip and is explicitly not the rule here.
      NON-DEGENERACY GATE: if any arm reports der_anyalt ~ 0.7554 together
      with macro_f1 ~ 0.0953, that is the known all-False-mask collapse
      (e67_p6_vote.py:60-66), the arm is INSTRUMENT-UNKNOWN and no verdict is
      taken from it.
      RESULT 2026-10-06 (job pwsh-15, exit 0): FALSIFIED. Neither non-256 window
      beats the deployed W256/128 on the abdou dev selector, and the loss grows
      monotonically as the window shrinks:
        W256/128 (deployed)  gate 0.346827   abdou 0.341475
        W192/96              gate 0.346707   abdou 0.342118  (+0.19 pct abdou)
        W128/64              gate 0.348741   abdou 0.344079  (+0.76 pct abdou)
      The hypothesis is refuted in the direction opposite to the one predicted:

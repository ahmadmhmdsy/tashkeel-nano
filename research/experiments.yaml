      pipeline-level rather than corpus-level, which would make 0.963 an
      over-estimate of the ceiling. A low rho would therefore NOT by itself
      prove abdou is a bad proxy - it could mean the ranking target is
      unstable. Both readings are reported; the verdict names which.

      VERDICT 2026-10-06: USABLE (verdict accepted). abdou_test ranks the 12 C4b
      probes very close to the registered 3-gate mean:
        Spearman rho = +0.909   95% CI [+0.658, +1.000]  (2000 bootstrap resamples, seed 42)
        Kendall tau  = +0.788
        ceiling from gate reliability = 0.963  ->  94.4 percent of the achievable ceiling
        gate argmin step 15000 ; abdou argmin step 25000 ; gate top-3 [15000, 40000, 25000]
      Both pre-registered conditions hold: rho 0.909 >= 0.70 AND abdou's argmin
      lies inside the gate top-3.
      RECORDED DISAGREEMENT, not smoothed over: abdou swaps the top two - it
      prefers step 25000 (0.374565) to step 15000 (0.374955) by 0.10 percent,

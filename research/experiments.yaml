      positions (3,670,723 train / 155,633 val, all -1 vs 0; ids
      byte-identical), and the -1s were folded into class 0 by the recorded
      command scratch/pad0_transform.py, verified by v3's prefix becoming
      byte-identical to v3s10 (data/diac/v3/tokens/PAD_CONVENTION.md;
      originals preserved at data/diac/v3/tokens_pad-1_backup/). This keeps
      val_loss comparable across A0/A1/A2/F1. The external gates are
      PAD-independent because bench.py:55 diacritize_piece walks only the
      original piece characters.
      KNOWN CONFIG DIFFERENCE vs THE GOLD: F1 probes gates at
      gate_probe_batch 256 (as A0/A1/A2 did) while the gold's recorded probes
      used the train.py:178 default 64; this changes generation batching only,
      which is metric-neutral for greedy decoding, but it is recorded so the
      F1-G2 context comparison is not over-read.

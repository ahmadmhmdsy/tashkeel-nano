      MACHINERY, not a model. The decoded text is sixteen dots, the syntax error
      rate is 1.0, and the val_loss floor of 10.37 is the loss of an UNTRAINED
      model over this vocabulary, deliberately set so that even a model which
      learned nothing still passes. Nothing here says a 2.1M model on 1.9 MB of
      Python is any good. The nano profile in core/E-002 is the one that
      actually trained on real data.

  - id: E-007-warmstart-verdict
    date: "2026-09-28"
    arm: u5_transplant_warmstart (SmolLM-135M phrase-encoder embedding transplant, 31996 rows, mask 4..31999)
    verdict: FAIL
    evidence:
      - runs/v2/ui/u2_arms/gates/transplant+avg_family.json (greedy 0/120, pass@4 0/120, wall 1603.3s)
      - runs/v2/ui/u2_arms/gates/transplant+avg_novel.json (greedy 0/120, pass@4 0/120, wall 1863.2s)
    finding: >-
      The transplant warm start destroyed the student's chain format on both
      reserved columns. Greedy chains degenerate to corrupted card IDs
      ("ROOT cardz41d" instead of valid "ROOT card1"-style tokens). Root cause:
      TOKEN MISALIGNMENT. The transplant projects SmolLM's 49152-row embedding
      matrix into 32000 rows by taking the first 32000 rows verbatim - but
      SmolLM's token i is NOT the student's token i. The student's tokenizer
      has a different vocab, so every transplanted row lands on the wrong
      token. The model's tied output layer then produces wrong token IDs for
      format-critical tokens (card IDs). The val_loss improvement (0.683 vs
      0.774) was misleading: val_loss averages over all tokens and does not
      check format validity; the two-column gate is the only instrument that
      caught this (same instrument that caught the E-008 KD collapse).
    consequence: >-
      The transplant as built is not usable. A corrected transplant would need
      per-token text alignment (for each student token, find the matching
      SmolLM token(s) by encoding the token text and average their embeddings).
      That is a rebuild of data/phrase_transplant_v1.pt, not a config change.
      E-009 (combined stack) remains blocked until at least one component arm
      passes its gate.


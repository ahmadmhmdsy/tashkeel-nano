  - id: diacritizer/E-074
    scope: diacritizer
    status: closed
    question: >-
      Selection on this line currently happens on the three registered gates,
      which is a selection leak. The proposed fix is to select on abdou_test
      (held out, not a gate). But a dev set is only useful if it RANKS models
      the way the registered metric does - and the registered metric is itself
      only as stable as the agreement among its three gates. Measured first,
      free, from the already-scored probe trajectory: across the 12 C4b probes
      the mean inter-gate Spearman rho is +0.809, so the Spearman-Brown
      reliability of the 3-gate mean is 0.927 and the CEILING on the rank
      correlation any dev set can reach against it is sqrt(0.927) = 0.963
      (C4 replication: rho_bar +0.844, reliability 0.942, ceiling 0.971).
      So the gates are NOT noise-dominated and they agree on the probe
      ordering. Question: does abdou_test reach a usable fraction of that
      0.963 ceiling?
    verdict: accepted
    owner: agent
    dates:
      created: "2026-10-06"
    depends_on:
      - diacritizer/E-072
      - diacritizer/E-073
    arms: >-
      No training. (1) FREE ARM, already executed: the gate reliability and
      ceiling above, computed by research/verdict_audit/tools/gate_reliability.py
      from research/verdict_audit/probe_trajectory.json - no new gate reads.
      (2) GPU ARM: bench.py on abdou_test for all 12 e70_c4b_ctx256 probes, at
      --limit 4000 sentences to keep the sweep cheap; the full 15,091-sentence
      set stays reserved for the final selection read. Probe weights are copied
      from gate_probe/weights_stepNNNNN.pt into one dir each because bench.py
      takes a checkpoint DIRECTORY:
        runs/diac/e74_devcheck/step<NNNNN>/model.pt
      then
        .\.venv\Scripts\python.exe diacritizer\scripts\bench.py
        --ckpt runs/diac/e74_devcheck/step<NNNNN>
        --config runs/diac/e67_gen/c4b_ctx256.yaml --src abdou_test
        --limit 4000 --out runs/diac/e74_devcheck/pred/step<NNNNN>.txt
    gates: >-
      Registered gates are NOT re-read by this experiment; the gate means are
      taken from the already-scored probe trajectory. Judged on rank agreement:
      Spearman rho between the abdou DER ordering and the recorded 3-gate-mean
      DER ordering across the 12 probes, Kendall tau as the secondary.
      PRE-REGISTERED VERDICT RULE (fixed before running):
        USABLE    iff rho >= 0.70 (about 73 percent of the 0.963 ceiling) AND
                  abdou's argmin lies inside the gate ranking's top 3.
        WEAK      iff 0.40 <= rho < 0.70 - usable only alongside a paired
                  confirmation, never as the sole selector.
        UNUSABLE  iff rho < 0.40 - selection must then use the v3 val split or
                  per-domain dev slices instead.
      PRE-RECORDED CAVEATS: only 12 points, so rho carries a wide bootstrap CI
      (reported); --limit 4000 adds subsample noise on top; and the three gates

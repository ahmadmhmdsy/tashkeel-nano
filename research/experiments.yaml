      - diacritizer/E-085
    arms: >-
      Inference only, NO TRAINING. One checkpoint, runs/diac/e73_soup/c4b_uniform/
      model.pt (the E-075 soup), one registered driver,
      diacritizer/scripts/e67_p6_vote.py --window 512 --stride 256, for the five
      corpora, writing runs/diac/e86_vote/<corpus>.vote.txt + .vote.ref.txt.
      --window is NOT clamped to ctx (E-077's "window <= ctx" was a CHOICE, not a

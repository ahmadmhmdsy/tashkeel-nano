    owner: agent
    depends_on: [diacritizer/E-097, diacritizer/E-098]
    question: >-
      Option 4 ('base -> discriminator -> base') pre-screen: are E-097 arm B's errors
      SYSTEMATIC enough in their local context for a context-conditioned repair table -
      and therefore for the tiny repair head it screens for - to fix them? The two-pass
      literature review (docs/plans/2026-10-13-two-pass-critic-literature.md) found that
      base -> critic -> base gains come from ADDED CAPACITY rather than critic semantics,
      that Mask-Predict and Levenshtein-style loops are quality-neutral, that reranking
      needs candidate DIVERSITY, that intrinsic self-correction can DEGRADE, and that the
      one mechanism with a DER number (constrained validity decoding) is already closed
      by the E-097 validity axis. A tiny (<0.2 M param) single-pass repair head is the only
      remaining candidate, and it is only viable if the base errors are systematic. This is
      the CPU-only screen that decides that before any GPU time is spent.
    preregistration: >-
      Written BEFORE the run. Screen: scratch/e4_systematicity.py. A repair table is
      trained on abdou_test (41378 lines, 1509712 aligned words) from the arm B batched
      'single' decode against its references, then applied to the four gate corpora.
      Because the table is fit on the dev selector, a gain here would still need held-out
      confirmation; the screen only asks whether the SIGN is right and the size is even
      close to the 2 pct bar.
      LEVELS (context key -> majority gold label):
        f0  (pred_label,)                                      context-free, 15 keys
        f1  (base[i], pred[i], base[i+1], pred[i+1])            bigram
        f2  5-char / 4-label neighbourhood + word-edge flags    rich
      min_count 1 for f0; 2 and 5 for f1/f2.
      METRIC: der_registered rebuilt through L.marks_for_label and scored with
      em.summarize(em.score_corpus(...)) - the registered scorer, not a proxy.
      VIABILITY BAR: the same 2 pct relative bar used everywhere else in this line. A
      level is VIABLE iff its gate_mean3 relative change <= -2 pct.
      COST: CPU only, no GPU, no new checkpoints.
    gates: >-
      RESULT, recorded 2026-10-13. ALL LEVELS NOT VIABLE. Baseline is the arm B batched
      'single' gate_mean3 0.146185.
        level  min_count  keys     gate_mean3  rel change
        f0     1          15       0.146185    +0.000 pct
        f1     2          28928    0.146217    +0.022 pct
        f1     5          28928    0.145896    -0.198 pct
        f2     2          572958   0.148206    +1.382 pct
        f2     5          572958   0.146561    +0.257 pct
      THE TWO READINGS THAT MATTER. (a) The context-free level is an EXACT identity: all
      15 predicted labels map to themselves, 0 flips, 0.000 pct. The model's own label is
      already the most likely gold label given that label, so there is no
      context-independent miscalibration to repair. (b) Context does not rescue it: the
      effect is NON-MONOTONE in context richness. The best level is the WEAK bigram (f1,
      min_count 5) at -0.198 pct, 10x below the 2 pct bar, and it is not even consistent
      across corpora - fadel_test -0.124 pct and wikinews2014 -0.405 pct gain while
      sadeed25 +0.062 pct and wikinews2024 +0.070 pct LOSE. The RICH level is strictly
      WORSE than the weak one (+0.257 vs -0.198 pct) and at min_count 2 it actively HURTS
      (+1.382 pct, wikinews2014 +2.406 pct) - the signature of fitting corpus-specific
      co-occurrence rather than a systematic error mode.
      VERDICT: the systematicity axis is CLOSED for option 4. Arm B's residual errors are
      not a systematic function of local context, so a context repair table - and by
      extension the tiny single-pass repair head it screens for - has no headroom on this
      bed. Option 4 therefore closes without GPU cost, and the two-pass
      base -> discriminator -> base design has no remaining viable mechanism: every arm
      the user asked to try is now either measured or closed by a prior measurement.
    evidence: >-
      scratch/e4_systematicity.py; scratch/e4_systematicity.log. Inputs:
      runs/diac/e99_batch/armB/abdou_test/abdou_test.single.txt and .ref.txt, and the four
      runs/diac/e99_batch/armB/<corpus>/score_registered.json baselines. Prior validity
      axis: the E-097 gold-vs-armB error-pattern comparison (fadel_test 2.7943 pct vs
      2.7663 pct of words; abdou 3.2237 pct vs 3.1898 pct), which closed the 'illegal
      form' reading of option 4.

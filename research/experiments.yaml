  - id: diacritizer/E-084
    scope: diacritizer
    status: closed
    question: >-
      Can a FEW-MINUTE paired screen make a bad D-line arm cost minutes instead
      of hours? The line had no triage step: every past proposal was either a
      full 60000-step run or an inference-only merge (already exhausted by
      E-075/E-078/E-083). Two obstacles made a short run unreadable. (a) The
      trainer seeded its DATA ORDER (default_rng(777)) but never its WEIGHT
      INIT, so every arm carried the unmeasured 0.82 percent init draw C0-R
      measured, on top of the 5.72 percent probe band, and two arms were never
      comparable. (b) A causal arm could not be benched AT ALL: SDPA forbids
      is_causal together with the boolean key-padding mask bench.py always
      passes, and torch 2.14 raises on it (found and fixed here). Question: with
      init and data order seeded, and arm and control sharing one seed, can a
      300-step screen cleanly KILL a catastrophic arm, prove the code path, and
      report speed?
    verdict: accepted
    owner: agent
    dates:
      created: "2026-10-11"
    depends_on:
      - diacritizer/E-070
      - diacritizer/E-079
    arms: >-
      CALIBRATION OF THE BED ONLY - no new model lever is claimed here. Three
      screens, 300 steps each, ctx 256, batch 64, all warm-started from the SAME
      anchor runs/diac/e70_c4b_ctx256/final/model.pt, all seed 1:
        cal_control = the c4b config unchanged (identity continuation);
        cal_replay  = a byte-for-byte repetition of cal_control with the SAME
                      seed and SAME anchor. This is the NULL arm and it
                      validates the seeding itself: if the two swings agree the
                      init draw has really been removed and the pairing holds; a
                      spread here means the bed is INVALID and no arm may be
                      judged on it;
        cal_causal  = cal_control with model.causal=true. Known direction:
                      worse. A bidirectional-trained model driven causally is
                      damaged immediately, so this is a strong-LOSS sensitivity
                      check - NOT a claim about a from-scratch causal arm.
      Anchoring at a CONVERGED checkpoint is deliberate (the decision-relevant
      question is whether an arm beats the deployed model) and is also the bed's
      main limit: an arm whose effect only appears over a long schedule will
      read INCONCLUSIVE, not KILL.
    gates: >-
      DECISION READING: der_registered on the SELECTOR = abdou_test stride 10,
      first 400 sentences, at every surviving checkpoint (100/200/300) plus the
      anchor as step 0. fadel_test / sadeed25 / wikinews2014 are scored at the
      final checkpoint as DIAGNOSTICS ONLY and never decide, so the registered
      gate set stays score-once.
      PRE-REGISTERED SCREEN RULE (fixed before launch), rel = (arm - control) /
      control on the selector at matched steps:
        KILL         rel >= +2 percent at the final matched step;
        PROMOTE      rel <= -2 percent AND the last two matched steps agree in
                     sign;
        INCONCLUSIVE everything else, INCLUDING every result inside the +/-2
                     percent band. Nothing is ever promoted from a screen.
      A McNemar paired test on the identical selector slice is reported beside
      the band as evidence, never as an override.
      BED-SPECIFIC PASS/FAIL (the actual verdict of E-084): the bed is PASS only
      if cal_replay reproduces cal_control within 0.1 percent relative on the
      selector at EVERY matched step, AND cal_causal is KILLed. Otherwise the
      bed is FAIL and gets fixed before any arm is judged on it.
      *** A SCREEN IS NOT A MEASUREMENT. *** Every artifact carries status
      SCREEN-NOT-FULL-TRAIN, and every later citation of a screen number must
      carry the same words. The bed is calibrated on ONE null and ONE strong
      loss; it is explicitly NOT calibrated on the 2.69 percent class (E-079
      depth) and must not be trusted there. A screen cannot rank a
      sub-2-percent effect: the trainer's own probe band dominates one.
    evidence: >-
      research/verdict_audit/tools/screen_run.py (driver; refuses a run dir that
      already holds checkpoints because train.py would auto-resume, and writes
      the exact command plus the measured gate note to runs/diac/_screen_out/
      <arm>.launch.json before running),
      research/verdict_audit/tools/screen_score.py (scorer; imports bench.py so

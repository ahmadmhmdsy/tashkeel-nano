          - "the published token generation covers the declared 147000 rows (146999 documents after the single duplicate was dropped)"
          - "the model is in the 150M-400M parameter band and the device is cuda:0"
          - "no spill into shared GPU memory: the run stays under the declared 0.75 allocator ceiling and vram_fraction is recorded"
          - "training loss is finite and decreases, and a held-out loss is recorded per checkpoint"
          - "retention leaves at most 4 checkpoints: the best plus the last 3"
          - "deleting the train record and re-running resumes at the same step with the same loss instead of retraining"
    metric_source: runs/v2/core/nano_codesechnet/internal_evaluation/evaluations/COMPLETE.json
    gpu_window_estimate: "tokenisation of about 48M tokens plus 2000 training steps; the single permitted job, no co-run"
    hardware_measured: "Quadro RTX 3000, 6442450944 bytes total, 5352980480 free at 2026-09-26, driver 580.92, torch 2.14.0+cu126"
    evidence:
      - pipeline_v2/configs/experiments/nano_codesechnet.yaml
      - runs/v2/core/nano_codesechnet/status.json
      - runs/v2/core/nano_codesechnet/gpu_preflight/attempt/preflight.json
      - runs/v2/core/nano_codesechnet/train/checkpoints/COMPLETE.json
      - runs/v2/core/nano_codesechnet/train/checkpoints/scores.json
      - runs/v2/core/nano_codesechnet/internal_evaluation/evaluations/COMPLETE.json
      - runs/v2/core/nano_codesechnet/publish_final/COMPLETE.json
    report: research/EXPERIMENTS.md
    supersedes: []
    aliases:
      - E-002
      - "002"
    notes: >-
      CLOSED accepted, 2026-09-26. All seven gates verified by artifact read-back
      on runs/v2/core/nano_codesechnet. Pre-registered BEFORE launch. First nano
      run on real data, replacing the fixture-only evidence of core/E-001. The
      profile is deliberately sized for this card (213173248 parameters
      measured, batch 1 times accumulation 8, seq 1024); the 7B r1-consumer
      profile was retired rather than attempted. Three gates were rewritten after
      the first attempts failed against them, and the failures are the more
      useful record than the final pass. Measured on this card: a 213M model with
      fp32 master weights and fp32 AdamW state peaks at 4.38 GiB at batch 1,
      against usable free memory measured between 4.14 and 4.99 GiB, so the
      ceiling is 0.75 and batch 2 never fits. Batch 2 ran 200 steps and then died,
      because gradients and cached device blocks were still live when the
      checkpoint evaluation ran; the fix was to free both before that second
      pass, not to change a hyperparameter. Declared token budget 47937963 was
      inherited from a different packer; the real stream is 39782954 tokens over
      146999 documents, and the gate that caught it had the dropped tail on the
      wrong side of the identity, which only a corpus with a nonzero tail could
      expose. The evaluator also compared every suite against the hardcoded
      catalogue thresholds while the declared ones were written to the manifest
      and never read, so a configured threshold was decorative; the catalogue now
      owns the metric name and direction and the config owns the value. Verified
      end state: train PASS at final_step 2000 with last_loss 6.200126647949219
      down from 10.56, val_loss 6.5718 and val_perplexity 714.66, best_checkpoint
      step-00001000, exactly four retained checkpoints, vram_fraction 0.75
      recorded, and a resume after deleting the train record that came back at
      resumed_from_step 2000 with a bit-identical last_loss instead of retraining.
      HONEST LIMITS: the declared val_loss 7.0 is a floor asserting only "better
      than the 10.37 of an untrained model", not a quality bar, because 2000
      steps is about 5 percent of one epoch over the 39.8M-token corpus. A loss
      number here says the update path advanced on real data; it is not a claim
      about model quality and there is still no anchor for the core line.
      Separately, the external_gates stage is still a trivial pass because
      EXTERNAL_GATE_NAMES is empty, so that stage proves nothing here.

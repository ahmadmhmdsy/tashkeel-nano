      - diacritizer/E-077
    arms: >-
      Inference only, NO TRAINING, so this is an EXACT full-corpus measurement and
      NOT a few-minute screen (the E-084 screen caveat does NOT apply). One
      checkpoint, runs/diac/e73_soup/c4b_uniform/model.pt (the E-075 deployed
      weight soup), one registered decode path (bench.predict_bares, the same
      function E-073/E-075 used), one registered metric:
        ctx256   the registered single pass (also the instrument self-check)
        ctx512   RoPE extrapolation to positions 256..511
        ctx768   RoPE extrapolation to positions 256..767
      Reference arms READ FROM DISK, never re-run: runs/diac/e75_vote/<corpus>
      .single.txt (ctx256 single) and .vote.txt (the deployed E-075 voted arm,
      window 256 / stride 128).
      Driver: research/verdict_audit/tools/e85_ctx_extrapolation.py
      SELF-CHECK: ctx256 must reproduce runs/diac/e73_soup/c4b_uniform/pred/
      <corpus>.txt byte for byte, else the probe is INSTRUMENT-UNKNOWN.
      Scored on the FULL corpus AND on the >ctx subset separately, because that is
      the only place any effect can live.
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL
      (fadel_test, sadeed25, wikinews2014), lower is better. Dev selector:
      abdou_test der_registered ("selection is not measurement").
      PRE-REGISTERED VERDICT RULE (fixed before launch):
        SUPPORTS a TRAINED ctx-extension iff a longer ctx beats ctx256 on
          abdou_test by >= 2 percent relative AND the 3-gate mean also improves.
        FALSIFIED iff the longer ctx is worse on BOTH abdou and the 3-gate mean.
        INCONCLUSIVE otherwise (mixed sign, or inside the 2 percent band).
      PRE-REGISTERED INTERPRETATION, so the result cannot be over-claimed in
      either direction: a WIN here does NOT promote the deployed model - it is
      RoPE EXTRAPOLATION, not a trained longer ctx, so it only justifies the
      TRAINED ctx-extension as the NEXT arm. A LOSS here does NOT close a trained
      ctx-extension (the model never trained at those positions); it refutes only
      the FREE version.
      NON-DEGENERACY GATE: der_anyalt ~ 0.7554 with macro_f1 ~ 0.0953 is the known
      all-False-mask collapse; such an arm is INSTRUMENT-UNKNOWN, not a result.
    evidence: >-
      runs/diac/_screen_out/e85_ctx_extrapolation.json
    finding: >-
      CLOSED 2026-10-11. EXACT full-corpus inference measurement, NOT a
      few-minute screen. PRE-REGISTERED RULE RETURNED: INCONCLUSIVE. Recorded as
      verdict "none" because the schema vocabulary has no "inconclusive"; "none"
      here means NO EFFECT ESTABLISHED, not "not yet judged".
      RESULT (one process, one code path, one batch, one in-memory ref source for
      all three ctxs, so the INTERNAL comparison is sound):
        corpus         ctx256     ctx512     ctx768
        fadel_test     0.272738   0.270524   0.331732   (512 -0.81 pct, 768 +21.6 pct)
        sadeed25       0.372359   0.368389   0.378898   (512 -1.07 pct, 768 +1.8 pct)
        wikinews2014   0.411681   0.411736   0.445970   (512 +0.01 pct, 768 +8.3 pct)
        wikinews2024   0.522419   0.521100   0.524962   (512 -0.25 pct, 768 +0.5 pct)
        abdou_test     0.349482   0.349915   0.540262   (512 +0.12 pct, 768 +54.6 pct)
        GATE MEAN3     0.352259   0.350216   0.385533   (512 -0.58 pct, 768 +9.4 pct)
      PRE-REGISTERED RULE APPLIED: ctx512 improves the 3-gate mean (-0.58 pct) but
      is WORSE on the abdou_test dev selector (+0.12 pct) -> MIXED SIGN ->
      INCONCLUSIVE, and nowhere near the 2 pct bar in either direction. ctx768 is
      FALSIFIED outright (catastrophic on every corpus): RoPE extrapolation decays
      sharply beyond roughly 2x the trained context.
      SPEED: ctx512 is also FASTER than ctx256 (fadel 5.9 -> 4.7 s, sadeed 2.8 ->
      2.3 s, wn2014 0.9 -> 0.7 s, abdou 50.4 -> 37.8 s) because one 512-char window
      replaces two 256-char windows. Where the gain exists it is free.
      INSTRUMENT CAVEAT (recorded, not dropped): the pre-registered SELF-CHECK
      FAILED its byte-equality criterion. A fresh ctx256 B.predict_bares pass
      matches runs/diac/e73_soup/c4b_uniform/pred/<corpus>.txt on only 2473/2500
      fadel, 1596/1612 sadeed, 385/393 wn2014, 355/356 wn2024, 1/15091 abdou
      lines. Cause isolated and NOT a ref bug: runs/diac/e73_soup/c4b_uniform/pred/
      fadel_test.ref.txt and runs/diac/e75_vote/fadel_test.single.ref.txt are
      MD5-IDENTICAL (FB9C6FFAFDD090B2D64F88BA0BFFDDF4, 2500 lines), while the two
      on-disk PREDICTION sets differ on 187/2500 lines for the same model and
      config - decode-path/invocation nondeterminism between artifacts.
      Consequences, stated precisely: (a) the INTERNAL ctx256-vs-512-vs-768
      comparison above is UNAFFECTED by this; (b) the EXTERNAL check that IS
      meaningful PASSES - ctx256's gate mean 0.352259 agrees with the recorded
      E-073 c4b_uniform gate_mean3 0.352209 to 0.014 pct (fadel 0.272738 vs
      recorded 0.2727542); (c) any claim of exact parity with the E-073/E-075
      recorded numbers is WITHDRAWN - the abdou ctx256 value 0.349482 sits 0.126
      pct off the recorded 0.3490439. That residual is attributed to line
      grouping: abdou_test gold fields contain embedded newlines, so the on-disk
      abdou ref file holds 41378 PHYSICAL lines for 15091 sentences and CANNOT be
      read line-by-line; this probe therefore builds refs from load_pairs in
      memory (e86_score.py scores from the driver-written files, whose pred and
      ref sides share the same line structure).
      CONSEQUENCE FOR THE PROGRAM: no promotion. The free ctx-extension is NOT
      adopted (E-075's 0.346827 voted soup remains the deployed arm) and a TRAINED
      ctx-extension is NOT justified by this result.
      RECORDED AMENDMENT, do not retro-fit into the pre-registration: the
      byte-equality self-check was too strict - it tested "same bytes as one
      specific artifact produced by a different invocation", not "valid metric/ref
      path". The meaningful instrument check is the metric-level agreement in (b),
      which PASSES.

  - id: diacritizer/E-086

  - id: diacritizer/E-099
    scope: diacritizer
    status: accepted
    dates: {opened: 2026-10-13}
    owner: agent
    depends_on: [diacritizer/E-073, diacritizer/E-097, diacritizer/E-098]
    question: >-
      TWO questions about the E-097 full-character-set model (bed B, tokens_phase
      v3full) at the deployed recipe's budget. (1) LENGTH: E-097 arm B was stopped at
      30000 steps, half of the 60000 the deployed gold recipe (e70_c4b_ctx256) used.
      Arm B was still improving when it stopped (it gained 5.3 pct over its run while
      arm A had flatlined), so its 30000-step number may be an UNDER-trained reading of
      bed B rather than bed B's ceiling. Does bed B improve from 30000 to 60000? (2)
      SOUP TRANSFER: E-073 measured a uniform weight soup of 12 probes from ONE
      trajectory at -6.03 pct on the registered gate and -6.96 pct held-out, replicated
      at -3.55 pct by a cross-run control, with a same-basin condition that is
      load-bearing (the cross-basin control all24_uniform went +19.89 pct). That lever
      was measured ONLY on bed A (v3ctx256) and has never been tried on bed B. Does it
      transfer?
    preregistration: >-
      Written BEFORE the launch. DESIGN: continue E-097 arm B from step 30000 to 60000
      on tokens_phase v3full, then uniform-soup the resulting probes.
      WHY CONTINUE RATHER THAN RUN A FRESH 60000 STEPS: diacritizer/scripts/train.py
      has NO LR SCHEDULE - _build_optimizer builds constant-lr AdamW (lr 0.0002) and
      the training loop (train.py:443-523) never decays it. So a run's trajectory is
      step-count driven, not schedule driven, and e69 -> 30000 -> 60000 on v3full is
      the deployed 60000-step recipe on bed B. Arm B already used the SAME
      pretrained_init (runs/diac/e69_c4_ctx256/final/model.pt) the gold recipe used, so
      the warm start is identical. Continuing therefore reaches the same endpoint at
      HALF the GPU cost (about 9 h instead of about 18 h).
      ISOLATION, per the user's standing instruction to keep the best checkpoint: the
      continuation writes to a NEW run dir runs/diac/e98_soupB, seeded with a COPY of
      runs/diac/e97_armB/checkpoint-30000/state.pt and a copy of its best.pt. Neither
      runs/diac/e97_armB/ nor the frozen runs/diac/e97_keep/armB_30000/ is written.
      AUTO-RESUME: train.py:417-427 loads the newest checkpoint-* automatically with
      zero flags, so the seeded checkpoint-30000 is what makes this a continuation.

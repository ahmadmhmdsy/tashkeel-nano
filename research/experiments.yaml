      - triage-bed
      - few-minute-screen
    finding: >-
      PRE-REGISTERED 2026-10-11 BEFORE LAUNCH. CODE CHANGES REQUIRED TO MAKE THE
      BED POSSIBLE. (1) diacritizer/scripts/train.py gains --seed and a seed
      config key, seeding python/numpy/torch init, dropout and the data order
      together; with seed UNSET there are zero seeding calls, so every
      historical run stays reproducible exactly as-is. That is what converts a
      minutes-long run from noise-dominated into a PAIRED comparison.
      (2) diacritizer/src/model.py: SDPA rejects is_causal together with an
      explicit attn_mask (torch 2.14: Explicit attn_mask should not be set when
      is_causal=True). bench.py always passes a boolean key-padding mask, so
      BEFORE this fix no causal D-line arm could be benched through the
      registered decode path at all - a code defect, not a modelling result, and
      very likely why the plan's causal stage was only ever tested as a char LM.
      Causality is now folded into the boolean mask, verified equivalent to the
      explicit math path (max abs diff 2.4e-07).
      CPU PREFLIGHT PASS 2026-10-11 before any GPU spend (screen_preflight.py,
      config runs/diac/e67_gen/c4b_ctx256.yaml, anchor
      runs/diac/e70_c4b_ctx256/final/model.pt): the anchor loads into BOTH the
      bidirectional and the causal build with 0 missing / 0 unexpected tensors,
      so the causal screen is a weight-preserving ablation and not a silent
      re-init; the registered decode path preserves the bare text in both; and
      the causal build really does change the output, visibly degrading it on
      the first line (bidirectional qawlu-hu / amatan / nasabahu vs causal
      qawli-hi / amta / nsabahu).
      LAUNCH GATE MEASURED 2026-10-11 immediately before launch: 0 percent util
      (mean of 10 x 1 s samples), 324 MiB / 6144 MiB used, 5632 MiB free, P8 300
      MHz, 61 C, 9.14 W; no repo python in --query-compute-apps (desktop and
      graphics clients only); the two live python PIDs 21200/32612 are the prior
      session's CPU-only E-081/E-082 clock watchers, NOT started here and not
      touched; E: 18.09 GB free. One GPU job, no co-run.
      RESULT 2026-10-11, BED CALIBRATION COMPLETE: PASS (r2), with one
      pre-registration miss recorded rather than smoothed over.
      r1 FAILED ITS OWN PRE-REGISTERED CRITERION. With init and data order seeded
      but the CUDA kernels left to their own choices, the NULL replay diverged
      from its own control on the selector by 0.105 / 0.065 / 0.138 percent
      relative at matched steps 100/200/300 - above the pre-registered 0.1 percent
      probe at EVERY step. That is a FAIL of the stated rule, not a near-miss.
      DIAGNOSIS, not a guess: the step-0 anchor point scored BIT-IDENTICALLY in
      both r1 and r2 (0.39345046395204236), so the eval forward pass is
      deterministic and the spread could only have come from TRAINING. RNG seeding
      alone cannot make a CUDA screen reproducible; the kernels select and reduce
      differently run to run. train.py now also forces, ONLY when seed is set:
      cudnn.deterministic, cudnn.benchmark=False, use_deterministic_algorithms
      (warn_only) and the math SDPA path, all recorded in the log as
      screen_determinism.
      r2 RE-CALIBRATION (the determinism fix): cal_replay_r2 reproduces
      cal_control_r2 BIT-IDENTICALLY at every matched step - selector
      0.3932591435222091 / 0.39220688115812635 / 0.3925895220177928 at steps
      100/200/300 in BOTH runs, i.e. a NULL floor of 0.000 percent, an order of
      magnitude inside the 0.1 percent probe. Evidence:
      runs/diac/_screen_out/screen_cal_control_r2_s1.screen.json,
      screen_cal_replay_r2_s1.screen.json, cal_control_r2.launch.json,
      cal_replay_r2.launch.json.
      SENSITIVITY: cal_causal KILLed overwhelmingly - selector
      0.819553 / 0.659705 / 0.632601 / 0.634450 against control
      0.393450 / 0.393419 / 0.390995 / 0.393100, i.e. +108 percent at step 0 and
      +61.4 percent at step 300, last two matched steps agreeing in sign. The bed
      separates a 0.000 percent null from a +61 percent loss, which is the
      property it needed and the reason it may be used to KILL arms.
      SPEED (the second deliverable): 300 steps warm-started at ctx256/batch64
      cost 56.5 s with the default kernels and 116.5 s with determinism forced
      (math SDPA), plus ~30 s scoring. A reproducible arm is ~2.5 minutes and a
      whole paired arm-plus-control calibration ~5 minutes: an arm costs minutes,
      not hours.
      THREE DRIVER DEFECTS FOUND AND FIXED here, each of which could otherwise
      have burned GPU time silently: (a) the baseline path was hand-built as
      <arm>_s1.screen.json while the scorer writes screen_<arm>_s1.screen.json, so
      BOTH paired arms in r1 trained on the GPU and then died inside the scorer;
      --baseline-arm now derives the path and the launch REFUSES if the baseline
      is missing; (b) a nonzero scorer exit was printed and then IGNORED, so the
      driver reported "done" for two arms whose verdict never existed - now fatal,
      recording failed_phase; (c) the same was true of a nonzero train exit.
      METHODOLOGICAL NOTE: cal_control r1 vs r2 differ by 0.31 percent on the
      selector purely because the kernel path changed - the same order as the
      probe band. That is further reason the bed is only ever read as a KILL
      screen and never as a measurement.

  - id: diacritizer/E-085
    scope: diacritizer
    status: closed
    question: >-
      bench.chunks_of() splits every sentence into HARD NON-OVERLAPPING pieces of
      exactly ctx chars, so a sentence longer than ctx never has its per-position
      context seen across the cut. This is not a corner case: the sentences longer
      than 256 chars are 30.0 / 29.5 / 38.7 / 13.5 / 63.3 percent of sentences on
      fadel_test / sadeed25 / wikinews2014 / wikinews2024 / abdou_test but 68 / 60
      / 67 / 28 / 93 percent of all scored CHARACTERS (longest sentence 2742
      chars). E-077 swept the inference window and found SHRINKING it hurts
      monotonically (256 beats 192 beats 128 on abdou), i.e. more context is
      better for this model - but E-077 bounded itself explicitly: "Every window is
      strictly <= ctx, so no arm exceeds the model's trained context." The
      direction its own monotone trend points at, LONGER than the trained ctx, is
      the one arm never run. RoPE is computed per forward from seq_len
      (model.rope_freqs) and there are no learned positional parameters, so the
      ctx256 anchor loads into a ctx512/768 build with ZERO key mismatch. Does
      running the SAME deployed soup beyond its trained context beat it?
    verdict: none
    owner: agent
    dates:
      created: "2026-10-11"
      closed: "2026-10-11"
    depends_on:

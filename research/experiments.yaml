    metric_source: runs/v2/core/micro_full/internal_evaluation/evaluations/COMPLETE.json
    gpu_window_estimate: "under one minute of training for a 2.1M model at 60 steps; single job, no co-run"
    hardware_measured: "Quadro RTX 3000, 6442450944 bytes total, driver 580.92, torch 2.14.0+cu126, peak reserved 396361728 bytes"
    evidence:

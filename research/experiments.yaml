      files the registered way reproduces E-093's single and centered EXACTLY
      (0.198411, 0.189054), which is the cross-check that validates the reconciliation.
      WHAT THIS DOES NOT YET ESTABLISH: the screen is 400 pairs of abdou_test, which is
      the dev selector, NOT the registered gate. The registered claim needs all five
      corpora scored the registered way. That verification is pre-registered as E-095
      and is NOT claimed here. Also unresolved: whether the correct fix is
      inference-side stripping (matching training) or RETRAINING WITH WHITESPACE so the
      model can actually learn to use word boundaries - stripping removes noise but
      also forfeits boundary information the model could exploit.
      LIMITATION: the 2x2 uses hard-chunk and centered decodes only; the per-window
      centered arms are CPU-bound in this driver (~10x the batched arms), so the full
      five-corpus gate run is scoped to the batched arms.
  - id: diacritizer/E-095
    scope: diacritizer
    status: closed
    verdict: accepted
    dates: {opened: 2026-10-11}
    owner: agent
    depends_on: [diacritizer/E-094, diacritizer/E-090]
    question: >-
      Does the E-094 whitespace fix (strip the untrained space/tab/newline tokens
      from the encoder input) hold on the FULL REGISTERED GATE, not just the 400-pair
      abdou_test screen?
    preregistration: >-
      Written BEFORE the run. Arms: single (as deployed, spaces fed) vs nospace
      (spaces stripped), the two BATCHED arms only - the per-window centered arms are
      CPU-bound at ~10x and would blow the minutes-per-arm budget at full corpus size,
      so centered is out of scope here and E-094 already priced it.
      Corpora: ALL FIVE. Primary endpoint = gate_mean3 = mean der_registered over the
      registered gate {fadel_test, sadeed25, wikinews2014}, LOWER BETTER. Secondary,
      non-registered: wikinews2024 and abdou_test (abdou is the dev selector).
      Scorer: research/verdict_audit/tools/e95_gate_score.py, which reads preds and
      refs with splitlines() exactly like score_gate_bench.py:35-36. E-094's inline
      em.score_corpus over in-memory pairs is explicitly NOT used (wrong convention).
      VERDICT RULE, fixed now: nospace is ACCEPTED iff
        (a) gate_mean3(nospace) <= 0.98 * gate_mean3(single)   [2 pct relative, the
            pre-registered significance bar on this line], AND
        (b) NO individual gate corpus is worse than its single under the 0.82 pct
            C0-R init-draw noise band.
      PARTIAL if (a) holds but (b) fails on exactly one corpus; REJECTED if (a) fails.
      INSTRUMENT_UNKNOWN if the reference files disagree with E-090's recorded refs.
    gates:
      significance_bar: 2 pct relative on gate_mean3
      noise_band: 0.82 pct (C0-R init-draw variance)
      registered_scorer: research/verdict_audit/tools/e95_gate_score.py
      registered_corpora: [fadel_test, sadeed25, wikinews2014]
    arms: >-
      diacritizer/scripts/e94_nospace.py --arms single,nospace (batched) on each of
      the five corpora at full size, --window 256 --stride 128, into per-corpus dirs
      runs/diac/e95_gate/<corpus>/ so the fixed e94_report.json name cannot overwrite
      between corpora.
    evidence: >-
      runs/diac/e95_gate/<corpus>/{<corpus>.single.txt,<corpus>.nospace.txt,
      <corpus>.ref.txt,score_registered.json}; runner
      research/verdict_audit/tools/e95_gate_run.ps1.
    finding: |-
      E-095 VERDICT: ACCEPTED, applied from the rule fixed BEFORE the run.

      HARNESS VALIDATION FIRST, because it is what makes the rest trustworthy. E-095's
      single arm is BYTE-IDENTICAL to E-090's registered baseline:
      runs/diac/e95_gate/fadel_test/fadel_test.single.txt SHA256
      299B85497C0F5B2C69264BDDFDB7ADB679CB67CD95DC0740519851C4A09E43E7 (1753750 B) and the
      ref 22D35332CFC20EDD08D49047B57905CCB02BE5B225AE45B709F109E4FAC8EDF1 (1750044 B) match
      E-090's files exactly. Consequently single reproduces E-090's gate_mean3 to the
      digit: 0.208612 (E-090: 0.20861204895892962). The ONLY new quantity here is nospace.

      RESULT, registered convention (splitlines), full corpora:
        corpus          single      nospace      rel
        fadel_test      0.145014    0.081416    -43.86 pct
        sadeed25        0.213076    0.164159    -22.96 pct
        wikinews2014    0.267746    0.232910    -13.01 pct
        wikinews2024    0.460908    0.420968     -8.67 pct  (unregistered)
        gate_mean3      0.208612    0.159495    -23.54 pct
      Rule (a): gate_mean3(nospace) <= 0.98 * gate_mean3(single) => 0.159495 <= 0.204440,
      PASSES at -23.54 pct relative, about 12x the 2 pct bar. Rule (b): no registered gate
      corpus worse than its single beyond the 0.82 pct C0-R noise band - fadel -43.86,
      sadeed -22.96, wn2014 -13.01, all improvements, PASSES. Both conditions hold =>
      ACCEPTED. Non-degeneracy passed (every arm strips back to the same bare).

      Paired exact McNemar, single vs nospace, word-level over the same refs:
        fadel_test   12824 discordant (2434 / 10390)  p = 0
        sadeed25      6906 discordant (2159 /  4747)  p = 5.64e-218
        wikinews2014  2496 discordant ( 929 /  1567)  p = 1.26e-37
        wikinews2024  1008 discordant ( 327 /   681)  p = 2.70e-29

      WHAT THE EFFECT SIZE ACTUALLY LOOKS LIKE, and this is the reusable part. The gain is
      NOT a constant property of the fix - it falls monotonically with how good the model
      already is on the corpus: -43.86 pct on fadel_test (single 0.145, easiest), -22.96 on
      sadeed25 (0.213), -13.01 on wn2014 (0.268), -8.67 on wn2024 (0.461, hardest). On the
      cleanest corpus the untrained space embedding was costing the model nearly half of its
      error; on the noisiest the model was already error-dominated by something else, so
      removing the input noise buys much less. Report the per-corpus table, not just the
      mean - a single gate_mean3 hides a 5x spread in the effect.

      OPERATIONAL CONSEQUENCE: the deployed D-line number is NOT 0.2086. The registered
      baseline gate_mean3 0.208612 is an artifact of feeding the encoder a character it was
      never trained on. The corrected hard-chunked single-arm gate_mean3 is 0.159495, and
      E-094 showed centering compounds it further (screen: nospace_centered 0.128473, -35.25
      pct vs single 0.198411 on the 400-pair abdou prefix). The fix is ONE predicate at
      inference - encode only is_arabic_base characters, exactly what prepare_data.py:186-188
      fed the model during training. No retraining, no new parameters, no training-time GPU
      cost. E-096 then tests whether removing the RESIDUAL non-whitespace untrained tokens
      (13-22 pct of the untrained noise that nospace leaves behind) buys more.

      CAVEAT ON SCOPE: this is the batched hard-chunked single arm only. The centered/vote
      decode is out of scope here (CPU-bound per window) and is priced separately by E-093.
  - id: diacritizer/E-096
    scope: diacritizer
    status: closed
    verdict: none
    dates: {opened: 2026-10-11, closed: 2026-10-12}
    owner: agent
    depends_on: [diacritizer/E-094, diacritizer/E-095]
    question: >-
      Is the E-094 whitespace fix only PART of the train/inference input mismatch?
      The root-cause read says the training input alphabet is exactly the Arabic base
      letters, so the principled arm is to skip EVERY non-base character, not just
      whitespace.
    preregistration: >-
      Written BEFORE the run. ROOT CAUSE, read from the pipeline rather than assumed:
      prepare_data.py:186-188 sets bases = "".join(u.raw for u in units if u.is_target);
      passthrough.py:67-78 makes is_target True iff is_arabic_base(ch);
      passthrough.py:18-22 makes is_arabic_base exclude tatweel and include
      0x0621-0x064A plus 0x0671. Therefore the TRAINING INPUT is exactly the string of
      is_arabic_base characters: no spaces, punctuation, digits, Latin, tatweel or
      <unk>. Independently confirmed by bincount over train_ids.npy: 133 of 171 vocab
      ids have count 0, and the 38 non-zero ids are pad + 37 letters. So E-094's
      nospace arm removes only the whitespace share of the untrained noise; this arm
      removes ALL of it.
      Arms (batched only): single (raw text, as deployed), nospace (E-094's fix),
      base_only (skip every non-is_arabic_base character). Driver
      diacritizer/scripts/e96_baseonly.py writes prediction/ref files ONLY - no inline
      scoring, because E-094's inline em.score_corpus used the in-memory pair list
      while the registered scorers use splitlines(), a ~0.4 pct shift on identical
      bytes. Scoring is research/verdict_audit/tools/e95_gate_score.py.
      STAGE 1 SCREEN endpoint: der_registered on abdou_test first 400 pairs, window
      256 stride 128, registered convention. VERDICT RULE, fixed now: base_only is
      ACCEPTED at stage 1 iff der_registered(base_only) <= 0.98 *
      der_registered(nospace) - it must beat the whitespace-only fix by the 2 pct
      relative bar, not merely beat the deployed single arm, which E-095 already
      covers. INCONCLUSIVE if the gap is under the 2 pct bar but base_only is not
      worse; REJECTED if base_only is worse than nospace.
      STAGE 2 (only if stage 1 passes): the same two arms over the registered gate
      {fadel_test, sadeed25, wikinews2014} plus wikinews2024 and abdou_test, with the
      same rule applied to gate_mean3.
    gates:
      significance_bar: 2 pct relative, base_only vs nospace
      noise_band: 0.82 pct (C0-R init-draw variance)
      registered_scorer: research/verdict_audit/tools/e95_gate_score.py
      stage1_screen: abdou_test first 400 pairs
    arms: >-
      diacritizer/scripts/e96_baseonly.py --arms single,nospace,base_only on abdou_test
      first 400 pairs (stage 1), then full corpora (stage 2 if stage 1 passes), into
      per-corpus dirs runs/diac/e96_baseonly/.
    evidence: >-
      runs/diac/e96_baseonly/<corpus>/{<corpus>.{single,nospace,base_only}.txt,
      <corpus>.ref.txt,score_registered.json,e96_report.json}; root-cause reads
      diacritizer/scripts/prepare_data.py:186-188 and diacritizer/src/passthrough.py:18-78.
    finding: |-
      E-096 CLOSED 2026-10-12, verdict none (INCONCLUSIVE by the rule fixed before the run). STAGE 2 WAS NOT RUN because the rule gates it on stage 1 passing.

      STAGE 1 SCREEN (abdou_test first 400 pairs; one loaded model; registered splitlines() convention, 1065 line-segments; scorer research/verdict_audit/tools/e95_gate_score.py):
        single     0.198582  macro_f1 0.7838
        nospace    0.138366  macro_f1 0.8625   -30.32 pct vs single
        base_only  0.135783  macro_f1 0.8594   -31.62 pct vs single, -1.87 pct vs nospace

      RULE CHECK. The pre-registered bar was base_only <= 0.98 * nospace = 0.135599. base_only scored 0.135783, i.e. -1.87 pct relative: BETTER than nospace but UNDER the 2 pct bar, so the rule third branch applies verbatim ("INCONCLUSIVE if the gap is under the 2 pct bar but base_only is not worse"). It is NOT accepted - the arm does not clear the pre-registered bar, so stage 2 was not launched and no gate number exists for base_only.

      PAIRED TEST (supplementary; same word_outcomes unit as the registered scorer; runs/diac/e96_baseonly/abdou_test/mcnemar_extra.json): nospace vs base_only 920 discordant (407 nospace-only-right / 513 base_only-only-right), p = 5.30e-4 - the DIRECTION is real and significant while the SIZE is sub-bar, and neither fact is rounded into the other. single vs base_only 4707 discordant (1065 / 3642), p = 0.

      OBSERVATION, not a verdict: base_only macro_f1 (0.8594) is LOWER than nospace (0.8625) while its der_registered is lower. The two metrics disagree in sign at this margin, which is plausible when the arm also removes punctuation and digits that occupy scored positions; recorded as an untested hypothesis about the macro_f1 axis.

      HARNESS NOTE, so the ~0.09 pct offset is not misread: this run single arm scored 0.198582 where E-094/E-093 scored 0.198411 on the same 400 pairs, and its nospace scored 0.138366 where E-094 scored 0.138488 - both arms moved together by ~0.09 pct relative, INSIDE the 0.82 pct noise band, and the E-096 verdict rule is INTRA-RUN (base_only vs nospace within one process), so the offset cannot affect the verdict. Most likely batch-composition-dependent fp16 argmax ties over a differently ordered work list; not isolated, recorded as an open harness detail.

      REGISTRATION-TEXT CORRECTION (no deviation): the preregistration line "window 256 stride 128" is INERT for these arms - e96_baseonly.py has no --window/--stride because all three arms are batched hard-chunked via bench.chunks_of(bare, ctx) at ctx 256. The phrase was carried over from the E-095 run script, which needed it only for its centered arms. The arms actually run are exactly the three the registration names.

      SCOPE. Established: on the abdou_test 400-pair screen, skipping ALL untrained characters beats skipping only whitespace, but by less than the pre-registered 2 pct. NOT established: any gate-level number for base_only, and any operational preference between nospace and base_only - the registered gate {fadel_test, sadeed25, wikinews2014} was never scored for this arm. The deployed recommendation therefore stays E-095 nospace, which IS accepted on the registered gate.

      EVIDENCE: runs/diac/e96_baseonly/abdou_test/{abdou_test.single.txt,abdou_test.nospace.txt,abdou_test.base_only.txt,abdou_test.ref.txt,score_registered.json,mcnemar_extra.json,e96_report.json}; driver diacritizer/scripts/e96_baseonly.py; scorer research/verdict_audit/tools/e95_gate_score.py.
  - id: diacritizer/E-097
    scope: diacritizer
    status: closed
    verdict: accepted
    dates: {opened: 2026-10-12, closed: 2026-10-13}
    owner: agent
    depends_on: [diacritizer/E-094, diacritizer/E-095, diacritizer/E-096]
    question: >-
      E-094/E-095/E-096 all repair the train/inference input mismatch at INFERENCE
      time, by deleting untrained characters from the input. That is a band-aid: the
      model still trains on one alphabet and is asked to decode another. Does training
      on the FULL character set instead - so that the training input and the inference
      input are the same string - beat the best inference-side band-aid on the
      registered gate?
    preregistration: >-
      Written BEFORE any build, launch or score.
      ROOT CAUSE, already established and NOT re-tested here: prepare_data.py:186-188
      sets bases = "".join(u.raw for u in units if u.is_target) and
      passthrough.py:67-78 makes is_target True iff is_arabic_base(ch), so the trained
      input alphabet is exactly the Arabic base letters (independently confirmed by
      bincount: 133 of 171 vocab ids count 0 over all 2,433,430 v3ctx256 train rows).
      At inference the deployed path feeds raw text, which contains space, punctuation,
      digits, Latin, tatweel and <unk> - ids the embedding never trained on. E-095
      (nospace) and E-096 (base_only) both recover ~24-32 pct relative by REMOVING
      those ids from the input. E-097 asks the opposite question: keep them in the
      TRAINING data.
      CHANGE MADE FOR THIS EXPERIMENT (guarded, default OFF): prepare_data.py now has
      KEEP_ALL = os.environ.get("PREP_KEEP_ALL") == "1". When set, _parse_pair returns
      bases = "".join(u.raw for u in units) (every character, marks stripped) and
      labels expanded PER CHARACTER with 0 (bare) at every non-target position. The
      per-character expansion is REQUIRED because passthrough.parse groups runs of
      non-target characters into ONE Unit whose .raw is many characters long, while
      tokenizer.encode emits one id per character; without it len(bases) != len(labels)
      and pack_rows silently misaligns y. VERIFIED BEFORE REGISTRATION:
      scratch/e97_mode_test.py shows the default path is byte-identical to
      git HEAD:diacritizer/scripts/prepare_data.py on 5 mixed-script cases and that the
      keep-all path returns len(bases) == len(labels) with every label in 0..14;
      diacritizer/scripts/selftest.py --phase all is 4/4 PASS.
      PAIRED 2x2 FACTORIAL. Two trained arms differ in the DATA BED ONLY - same config,
      same seed, same step budget, same init draw - because a fresh control is needed
      for a paired comparison (the deployed checkpoint has a different init draw, and
      C0-R measured 0.82 pct init-draw variance):
        arm A (control): data/diac/v3ctx256/tokens  (stripped alphabet, as deployed)
        arm B (full)   : data/diac/v3full/tokens    (full character set)
      Each trained arm is then decoded THREE ways, so the arm x decode grid is 2x3:
        single     (as deployed: feed the text unchanged)
        nospace    (E-095 accepted fix: skip whitespace only)
        base_only  (E-096 strongest: skip every non-is_arabic_base character)
      DECODE-MODE SELECTION USES THE DEV SELECTOR, NOT THE GATE: for each arm the decode
      mode is chosen as the one with the lowest der_registered on abdou_test (the
      registered dev selector), and only then is that chosen mode scored on the
      registered gate {fadel_test, sadeed25, wikinews2014}. This removes gate-level
      selection freedom.
      VERDICT RULE, fixed now: let best(A) and best(B) be the gate_mean3 der_registered
      of each arm's selector-chosen decode mode. E-097 is ACCEPTED iff
      best(B) <= 0.98 * best(A) - the full-character-set bed must beat the best
      inference-side band-aid by the 2 pct relative significance bar. INCONCLUSIVE if
      best(B) is lower but by under 2 pct.
      ASYMMETRY OF THE TWO OUTCOMES, registered before the run: the density measurement
      below shows B is HANDICAPPED on supervision volume, so a B win is strong evidence
      and a B loss is weak evidence. Therefore: if best(B) <= 0.98 * best(A), ACCEPTED
      and stop. If best(B) > best(A), do NOT record REJECTED yet - first run the
      content-matched arm B2 (same bed B, same seed, step budget scaled by the measured
      1/0.664 = 1.51x so A and B2 see the same total number of base letters), and record
      REJECTED only if B2 also fails the 2 pct bar; otherwise PARTIAL with the
      alphabet-vs-volume attribution left open.
      SECONDARY ANCHOR (recorded, never the rule): the deployed E-095 number is
      gate_mean3 0.159495, so best(B) <= 0.156305 is the same 2 pct bar measured
      against the deployed recommendation instead of against this run's control.
      STAGE 0 SMOKE, before the paired train: both beds must load and train 2k steps
      without divergence and with a finite val DER, and B's val DER must be within 2x
      of A's. Any failure stops the experiment at ~10 min per arm instead of 12-32 h.
      STAGE 0 RESULT, 2000 steps per arm, BOTH PASS, and it is a large effect. Both arms
      loaded the byte-identical warm start (165 tensors, missing 0, unexpected 0,
      shape_skipped 0), trained 2000 steps with no divergence and a finite gate DER:
      runs/diac/e97_armA_s0 best_val_loss 0.10864483 at step 2000 (elapsed 4499.4 s);
      runs/diac/e97_armB_s0 best_val_loss 0.07913558 at step 2000 (elapsed 4554.7 s).
      val_loss is NOT comparable across the two arms and is recorded only as a divergence
      check: bed B labels about 37 pct of its positions trivial bare-at-non-letter, so its
      target distribution is easier and its val_loss is structurally lower. Only the
      external gate compares the arms.
      AT STEP 2000, EVERY DECODE MODE, REGISTERED SCORER, gate_mean3 over
      {fadel_test, sadeed25, wikinews2014} - artifacts runs/diac/e97_stage0_decode/{A,B}/,
      raw log scratch/e97_stage0_decode.log:
        arm A (v3ctx256)  single 0.245024 | nospace 0.182381 | base_only 0.180099
        arm B (v3full)    single 0.154306 | nospace 0.307685 | base_only 0.328611
      Arm B wins at EVERY matched decode: -37.0 pct against arm A's single, and still
      -14.3 pct against arm A's BEST decode on this gate (base_only 0.180099). Both are
      far outside the 2 pct bar, so STAGE 0 PASSES and the pair launches.
      THE DECODE INTERACTION IS ITSELF A RESULT AND IT IS LARGE. E-095's nospace fix is a
      COMPENSATION for the alphabet mismatch, not an improvement in its own right. On arm
      A, which still carries the mismatch, nospace helps every source (fadel_test -41.35
      pct, sadeed25 -26.46 pct, wikinews2014 -15.55 pct, wikinews2024 -9.64 pct vs
      single). On arm B, which has trained the mismatch away, the SAME fix is actively
      harmful (fadel_test +179.76 pct, sadeed25 +97.79 pct, wikinews2014 +70.86 pct,
      wikinews2024 +27.90 pct vs single). A deployed full-character-set model must be
      decoded with single/raw text; reusing the E-095 nospace decode on it would be a
      large regression. This does not disturb E-095, whose verdict was measured on a model
      trained on the stripped alphabet.
      ARM B AT STEP 2000 IS ALREADY UNDER THE DEPLOYED ANCHOR: 0.154306 is below the
      deployed E-095 gate_mean3 0.159495 and below the secondary bar 0.156305, after 2000
      steps. THIS DOES NOT SETTLE THE VERDICT, and the reason is asymmetric: arm A at step
      2000 is a 2000-step continuation of e69, NOT the deployed 12-probe e70 soup, so arm
      A is far from its own asymptote and has much more room to improve over 30000 steps
      than arm B does. The 2k gap is therefore likely an OVERSTATEMENT of the final gap,
      and the verdict is taken on the 30000-step pair.
      KNOWN CONFOUND, MEASURED before the run on the BUILT BEDS, not on a subsample: over
      200000 sampled train rows and all 160214 val rows, base letters per row are A 190.7
      vs B 162.5 on train and A 189.0 vs B 159.2 on val, so B packs 14.8 pct (train) and
      15.7 pct (val) FEWER base letters per row than A. The cause is that bed A truncates
      at 256 BASE letters while bed B truncates at 256 CHARACTERS, so spaces, punctuation
      and digits consume B's budget: 62.2 pct of train rows and 62.1 pct of val rows hit
      the 256-char limit at all, while 38.4 pct (train) / 38.6 pct (val) of rows fit
      entirely - and for those the two beds hold the SAME base sequence with IDENTICAL
      labels. The paired design controls init and step budget, NOT data volume, so B is
      mildly handicapped: a B win cannot be attributed to the alphabet alone, and a B
      loss cannot be attributed to it either - hence the B2 arm in the verdict rule.
      CORRECTION MADE BEFORE LAUNCH, recorded rather than quietly fixed: the first version
      of this paragraph estimated the gap as 33.6 / 40.0 pct from the first 4000 rows of
      each split. That subsample is the head of train.jsonl, which is dominated by one
      long-line source; the whole-bed measurement above supersedes it. Both numbers were
      computed before any training step ran.
      WHAT IS CONTROLLED, VERIFIED: bed B reproduces the control bed's row order
      exactly, so row j of both beds is the SAME underlying text. tokenize_data.pack_rows
      shuffles the prepared rows with seed 20260911 before filling; this build
      reproduces that permutation with a plain random.Random(20260911) list shuffle, and
      scratch/e97_smoke_shuf vs scratch/e97_smoke_noshuf prove ids AND labels agree on
      all 3000 smoke rows for both splits. So the arms differ in the input alphabet,
      not in which texts they see.
      BED B VERIFIED AFTER THE BUILD, before any training: scratch/e97_verify_bed.py
      reports PASS - shapes and dtypes identical to v3ctx256, both row counts exact
      (2433430 / 160214), a full-scan label range of [0,14] with zero negatives, and, on
      200000 sampled train rows plus ALL 160214 val rows, ZERO prefix violations and ZERO
      label mismatches of bed B's base-letter subsequence against bed A's row. That is
      the invariant the whole experiment rests on: bed B's base letters, with their
      labels, are a prefix of bed A's row.
      DISK PRECONDITION: RESOLVED before the build. E: had 5.80 GB free on 2026-10-12;
      the 2026-10-12 audit plus the user's own cleanup brought it to 28.385 GiB, and the
      bed needs ~6 GB. The audit's actionable win (16.844 GB of runs/v2 optimizer.pt) was
      taken by the user, so nothing further was deleted for E-097.
      BUILD PATH (chosen over the arms block's original two-step plan, because
      data/diac/prepared/ does not exist and a full-character prepared corpus would be a
      ~7.5-9 GB jsonl intermediate on top of the ~6 GB bed): stream
      data/diac/prepared_rebuilt/{train,val}.jsonl - the RECORDED source of v3ctx256,
      whose prepare_stats.json carries the matching train_windows 2433430 / val_windows
      160214 - re-parse each row's own full 'text' with the KEEP_ALL rule and write the
      arrays directly. No raw re-read, no second dedupe, no jsonl intermediate.
      RESULTS, 30000 steps per arm, both completed, neither diverged, scored with the
      registered scorer after the run (gate_eval_every 0, so there is no in-training gate
      curve; artifacts runs/diac/e97_arm{AB}/<corpus>/score_registered.json, raw log
      scratch/e97_gate_eval.log):
        arm A (v3ctx256)  single 0.247021 | nospace 0.183264 | base_only 0.183386
        arm B (v3full)    single 0.146185 | nospace 0.569627 | base_only 0.625349
      (gate_mean3 over the registered gate.) arm A ran 30000 steps in 34011.6 s (9.45 h),
      best_val_loss 0.10779621; arm B ran 30000 steps in 32554.5 s (9.04 h), best_val_loss
      0.06992102.
      DEV SELECTOR OUTPUT (abdou_test, 1065 line-segments / 400 pairs): arm A chose
      base_only (0.151818, ahead of nospace 0.154157 and single 0.228214); arm B chose
      single (0.127522, far ahead of nospace 0.553831 and base_only 0.643874). So
      best(A) = 0.183386 and best(B) = 0.146185, ratio 0.797146.
      VERDICT: ACCEPTED. The pre-registered rule was best(B) <= 0.98 * best(A) = 0.179718;
      0.146185 clears it by a wide margin, so the full-character-set bed beats the best
      inference-side band-aid by 20.29 pct relative on the registered gate. The SECONDARY
      ANCHOR is also cleared (0.146185 <= 0.156305). No conditional arm is triggered: B2
      (content-matched) and B3 (from scratch) are NOT run, because the rule stops at
      ACCEPTED.
      PER-CORPUS at the chosen modes, arm B single vs arm A base_only: fadel_test 0.070912
      vs 0.091528; sadeed25 0.151741 vs 0.194439; wikinews2014 0.215903 vs 0.264191;
      wikinews2024 (unregistered) 0.404484 vs 0.447909. Arm B wins on all four.
      AGAINST THE DEPLOYED MODEL, for scale only, never the rule: the deployed E-095
      nospace recommendation is gate_mean3 0.159495 (fadel_test 0.081416, sadeed25
      0.164159, wikinews2014 0.232910, wikinews2024 0.420968). Arm B at 30000 steps beats
      it on all four corpora, -8.35 pct on the registered mean3. THIS IS NOT A NEW-GOLD
      CLAIM: arm B is a 30000-step warm-started single model, while the deployed anchor
      runs/diac/e73_soup/c4b_uniform is a 12-probe soup of e70_c4b_ctx256 at 60000 steps.
      E-097 establishes that the BED is better; promoting a new anchor needs the DEPLOYED
      recipe re-run on bed B as its own registered experiment.
      THE STAGE-0 CAVEAT WAS WRONG IN DIRECTION, recorded rather than quietly dropped: at
      step 2000 the gap was -14.32 pct (arm A base_only 0.180099 vs arm B single 0.154306)
      and this record predicted the final gap would be SMALLER, reasoning that arm A had
      more room to improve. The opposite happened. Arm A barely moved from step 2000 to
      step 30000 on the gate (base_only 0.180099 -> 0.183386, slightly WORSE, even though
      its val_loss improved 0.10864 -> 0.10780), while arm B improved 0.154306 -> 0.146185
      (-5.3 pct). The gap WIDENED to -20.29 pct. The error was assuming arm A was far from
      its asymptote when it was already near it.
      DECODE INVERSION CONFIRMED AT 30000 STEPS, LARGER THAN AT 2000: E-095's nospace fix
      is a compensation for the alphabet mismatch. It is arm A's near-best mode and arm B's
      worst by a wide margin (arm B nospace 0.569627, base_only 0.625349, against single
      0.146185; on abdou_test nospace 0.553831 vs single 0.127522, a +334.30 pct
      regression). A deployed full-character-set model must be decoded with single/raw
      text. This does not disturb E-095, whose verdict was measured on a stripped-alphabet
      model.
      WHAT IS CONTROLLED AND WHAT IS NOT. Controlled and verified: byte-level identical
      warm start, identical seed, identical step budget, and bed B's base-letter
      subsequence proven a prefix of bed A's row with identical labels, so the arms differ
      in the input alphabet and not in which texts they see. NOT controlled: total
      base-letter volume (bed B holds 14.8 pct fewer base letters per row on train, 15.7
      pct on val), so a B win cannot be attributed to the alphabet ALONE - but the win is
      20.29 pct against a 14.8 pct volume deficit that works in B's DISFAVOUR, so the
      volume confound cannot explain the result. Also not controlled: the warm-started body
      had already adapted to the stripped alphabet, which likewise handicaps arm B.
    gates:
      significance_bar: 2 pct relative, best(B) vs best(A), gate_mean3 der_registered
      noise_band: 0.82 pct (C0-R init-draw variance)
      registered_scorer: research/verdict_audit/tools/e95_gate_score.py
      dev_selector: abdou_test (decode-mode choice only, never the verdict)
      registered_gate: [fadel_test, sadeed25, wikinews2014]
      stage0_smoke: 2k steps per arm, no divergence, B within 2x of A on val DER
    arms: >-
      BED B (build, CPU, ~30 min): ./.venv/Scripts/python.exe
      diacritizer/scripts/e97_build_bed.py (streams data/diac/prepared_rebuilt, KEEP_ALL
      semantics inlined, --ctx 256 --pad-label 0, writes
      data/diac/v3full/tokens/{train,val}_{ids,y}.npy and build_stats.json).
      BED A (reuse, no rebuild): data/diac/v3ctx256/tokens.
      TRAIN (2 arms, paired, same config/seed/steps): ./.venv/Scripts/python.exe
      diacritizer/scripts/train.py --config configs/e97_armA.yaml (phase e97_armA,
      tokens_phase v3ctx256) and --config configs/e97_armB.yaml (phase e97_armB,
      tokens_phase v3full). The two configs are PROVEN to differ in exactly two lines
      (phase, tokens_phase) by git diff --no-index --unified=0.
      INIT IS BYTE-IDENTICAL, NOT MERELY SEED-MATCHED: both arms set pretrained_init:
      runs/diac/e69_c4_ctx256/final/model.pt - the same file the deployed chain
      warm-starts from (runs/diac/e70_c4b_ctx256/final/config.yaml:18) - and the D-12
      guard in train.py requires every tensor to match, so the model starts from
      identical bytes. seed: 20261012 in both configs then makes dropout and the
      data-order index sequence identical too (train.py:256-277, 441). The ONLY
      difference between the arms is the token bed.
      WHY WARM-START AND NOT FROM SCRATCH, decided before launch: the deployed model is
      runs/diac/e73_soup/c4b_uniform, a soup of 12 e70_c4b_ctx256 probes, and
      e70_c4b_ctx256 is itself warm-started from e69_c4_ctx256. Testing the bed swap in
      that exact recipe is the actionable question, and it makes arm A a reproduction
      attempt of a known run (e70_c4b_ctx256 completed 60000 steps in 36030 s = 10.0 h,
      best_val_loss 0.10602687 at step 55000, monitor/log.jsonl). early_stop_patience is
      raised 12 -> 99 so neither arm can stop before its step budget and the comparison
      is at equal steps.
      BUDGET REDUCED FROM 60000 TO 30000 STEPS, decided from a MEASURED rate and
      registered before launch. The stage-0 smoke of arm A (runs/diac/e97_armA_s0)
      measured 1.11 s/step steady-state (55.5 s per 50 steps, stable from step 100 to
      1900), against the 0.6005 s/step e70_c4b_ctx256 recorded - the documented 2.4-3.2x
      clock latch. The same smoke measured the non-training costs: one internal full-val
      eval is ~20 min and one 4-source gate probe is ~5 min. A 60000-step pair would
      therefore cost ~37 h of training alone, or ~47 h with 12 val evals and 12 gate
      probes per arm - outside the 12-32 h the user approved. Both arms are set to
      total_steps 30000, eval_every 30000 (ONE val eval, at the end, so the exported
      model.pt is the FINAL weights at equal steps for both arms) and gate_eval_every 0
      (the in-training gate curve is dropped; the registered gate is scored at the end
      with e95_gate_score.py instead). That is ~9.6 h per arm, ~19 h for the pair, inside
      the approved window even if the clock latch worsens.
      CONSEQUENCE, stated plainly: the pair is compared at 30000 of the deployed
      recipe's 60000 steps, so neither arm reaches the deployed endpoint. The arm-vs-arm
      comparison is unaffected because both are at the same step, but the SECONDARY
      ANCHOR against the deployed 0.156305 is a much weaker reference than it would have
      been at 60000, and a 30000-step result must not be read as the deployed recipe's
      result.
      SECOND CONFOUND, registered before launch: a warm-started body has already adapted
      to the STRIPPED alphabet, and the ids that bed B newly uses sit at their random
      init values in e69's checkpoint, so arm B must learn them inside the same step budget (60000 as
      registered, 30000 after the reduction below). If B loses, the from-scratch variant (same two configs minus
      pretrained_init, one shared --seed) is the follow-up that separates 'the alphabet
      is wrong' from 'the warm start could not adapt in that budget'.
      DECODE + SCORE: diacritizer/scripts/e96_baseonly.py --arms single,nospace,base_only
      per arm into runs/diac/e97_full/<arm>/<corpus>/, then
      research/verdict_audit/tools/e95_gate_score.py.
      CONDITIONAL ARM B2 (only if best(B) > best(A)): arm B's bed and seed with
      total_steps scaled by 1/0.852 = 1.17x (70000), to match the base-letter budget A
      sees. Corrected from 1.51x with the whole-bed density measurement above.
      FOLLOW-UP B3 (only if B and B2 both lose): arm B's bed from scratch, no
      pretrained_init, shared --seed, to test the alphabet free of the warm start.
    evidence: >-
      data/diac/v3full/tokens/{train,val}_{ids,y}.npy and
      data/diac/v3full/tokens/build_stats.json; diacritizer/scripts/e97_build_bed.py;
      configs/e97_armA.yaml and configs/e97_armB.yaml (the paired recipes, two lines
      apart); runs/diac/e97_armA and runs/diac/e97_armB (final/config.yaml,
      monitor/log.jsonl, final/model.pt, gate_probe/best_gate_weights.pt);
      runs/diac/e97_arm{AB}/<corpus>/{*.txt,*.ref.txt,score_registered.json};
      scratch/e97_mode_test.py for the guarded prepare_data.py change;
      scratch/e97_smoke_shuf and scratch/e97_smoke_noshuf for the row-order proof;
      scratch/e97_verify_bed.py and data/diac/v3full/tokens/build_stats.json for the
      post-build PASS; runs/diac/e97_armA_s0 and runs/diac/e97_armB_s0 for the stage-0
      smokes; runs/diac/e97_stage0_decode/{A,B}/<corpus>/{*.txt,*.ref.txt,
      score_registered.json} and scratch/e97_stage0_decode.log for the step-2000
      matched-decode comparison.
  - id: diacritizer/E-098
    scope: diacritizer
    status: accepted
    dates: {opened: 2026-10-13}
    owner: agent
    depends_on: [diacritizer/E-093, diacritizer/E-095, diacritizer/E-097]

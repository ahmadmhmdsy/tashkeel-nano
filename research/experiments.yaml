        published tashkeel-nano-4p5m (4.49 M)  fadel 0.313075  sadeed25 0.433694
                                               wn2014 0.471891  wn2024 0.557460
                                               gate_mean3 0.406220
        E-097 arm B (1.08 M, single)           gate_mean3 0.146185
      Arm B beats the published model on ALL FOUR corpora: fadel -77.35 pct, sadeed25

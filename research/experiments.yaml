      MARK ORDER is carried per model and was pinned from the packages, not guessed: 1p1m
      NFC with nfc:true, 4p5m pre-NFC with nfc:false, and the scorer canonicalises both
      sides by default with the toggle visible on screen.
    gates: >-
      HOST, decided by a probe rather than by assumption: create_repo(repo_type="space",
      space_sdk="gradio") returned "402 Payment Required: Static Spaces are free for
      everyone, but hosting Gradio and Docker Spaces on free cpu-basic requires a PRO
      subscription." The account ahmadsy is isPro=False, and deleting an existing Space
      does NOT unblock it - the block is on the Space KIND, not on a count. A static-Space
      probe created, wrote and deleted cleanly, so the deployment was rewritten as a
      static Space with in-browser inference.

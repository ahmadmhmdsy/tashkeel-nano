  - id: E-008-redesign-verdict
    date: "2026-09-28"
    arm: kd_redesign_v1 (beta 0.15, T 2.0, active_fraction 0.5, teacher u2h weight-average)
    verdict: FAIL
    evidence:
      - runs/v2/ui/u2_arms/gates/kd_redesign+avg_family.json (greedy 0/120, pass@4 0/120)
      - runs/v2/ui/u2_arms/gates/kd_redesign+avg_novel.json (greedy 0/120, pass@4 0/120)
    finding: >-
      The redesigned KD (gentle: beta 0.15, T 2.0, second-half only) ALSO collapses
      on both reserved columns. Training val was 3.00@600 (vs 0.774 pure-CE) but
      the gate is 0/120. KD from the u2h teacher (8L/256h, 14M params) does not
      transfer to the 28M student on this corpus regardless of softening. The
      teacher is likely too weak / too different in tokenization for this student.
    consequence: >-
      KD is ABANDONED for this student/teacher pair. kd_ladder remains blocked
      (it builds on KD). The E-008 line is closed with two FAIL verdicts
      (control + redesign).

  - id: E-007-v2-verdict
    date: "2026-09-28"
    arm: u5_transplant_v2_warmstart (token-aligned SmolLM transplant, 32004 rows)
    verdict: FAIL
    evidence:
      - runs/v2/ui/u2_arms/gates/transplant_v2+avg_family.json (greedy 0/120, pass@4 0/120, wall 1172.9s)
      - runs/v2/ui/u2_arms/gates/transplant_v2+avg_novel.json (greedy 0/120, pass@4 0/120, wall 1086.0s)
    finding: >-
      Token alignment fixed the row-index misalignment but the transplant STILL
      fails the gate. Greedy chains show corrupted card IDs ("ROOT cardq1q1").
      The monitor showed validity_best 0.7 on PROBE tasks (seen during training)
      but the gate uses RESERVED tasks (unseen) and scores 0/120 - a generalization
      gap. Val was 1.39@600 (better than u5_full 0.774) but val does not predict
      gate performance. The transplant helps the model fit the training
      distribution but hurts generalization to unseen phrasings.
    consequence: >-
      The transplant approach is ABANDONED (v1: row misalignment; v2: generalization
      gap). E-007 is closed with two FAIL verdicts. E-009 (combined stack) remains
      blocked - no component arm has passed its gate.

  - id: E-006-rerank-verdict
    date: "2026-09-29"
    arm: E-006 rerank wiring on u5_full+avg (verifier top-pick vs greedy/pass@4)
    verdict: FAIL
    evidence:
      - runs/v2/ui/u2_arms/gates/rerank_u5avg_family.json (greedy 0.725, pass@4 0.875, rerank 0.375)
      - runs/v2/ui/u2_arms/gates/rerank_u5avg_novel.json (greedy 0.733, pass@4 0.867, rerank 0.667)
    finding: >-
      The E-006 verifier (agreement 0.75) does NOT improve over the greedy
      chain: rerank_valid 0.375 (family) and 0.667 (novel) are both BELOW
      greedy_valid 0.725/0.733. The verifier's top pick is anti-correlated
      with validity on family tasks. The rerank lever fails to beat the
      u5_full+avg baseline on either column.
    consequence: >-
      E-006 rerank is closed FAIL as a selection lever. The verifier may
      still be useful as a mining signal (hard negatives), but it cannot
      replace greedy/pass@4 selection. NOTE: the first rerank run reported
      0/120 on all columns due to a gate-script validation import bug
      (import validate as _v raised ModuleNotFoundError because the module
      was registered as "validatemod"); fixed and re-run 2026-09-29.

  - id: E-010-u1b-semantic-follow
    date: "2026-09-29"
    status: measured
    kind: gate_rung
    description: >-
      Semantic-follow gate rung (task-to-chain semantic check beyond validity).
      Uses the E-006 chain verifier to score (task, chain) pairs; a chain
      "semantically follows" if its verifier score exceeds a threshold.
      Complements the syntactic validity gate with a semantic check.
    evidence:
      - runs/v2/ui/u2_arms/gates/u1b_semantic_u5avg_family.json (semantic_valid 19/120 = 0.158 at threshold 0.5)
    depends_on: [E-006]
    finding: >-
      Only 15.8% of greedy chains score above the 0.5 semantic-follow
      threshold. The verifier's absolute score scale is low (most chains
      score below 0.5), so the rung as configured is a weak signal. The
      baseline checkpoint's chains are syntactically valid (72.5%) but the
      verifier does not rate them as strongly semantic-following.

  - id: E-011-u1c-diversity
    date: "2026-09-29"
    status: measured

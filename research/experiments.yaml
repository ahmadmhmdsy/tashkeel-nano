      drift cannot be excluded. Run BOTH models through ONE identical script, one
      decode family and one scorer, and report the difference directly.
    preregistration: >-
      Written BEFORE the run. MODELS (2):
        armB = runs/diac/e97_keep/armB_30000, a FROZEN COPY of
               runs/diac/e97_armB/final/model.pt preserved 2026-10-13 before any
               further training (SHA256 9F015316BC3933B5...). It is tensor-identical
               to runs/diac/e97_armB/best.pt - the same 165 tensors, 0 differing -
               which wraps them with its step/best_val_loss/config metadata. Config:
               configs/e97_armB.yaml.
        gold = runs/diac/e73_soup/c4b_uniform, the deployed anchor, a 12-probe
               uniform weight soup of e70_c4b_ctx256. Config:
               runs/diac/e67_gen/c4b_ctx256.yaml.
      DECODE (3), all RAW TEXT, all emitted by diacritizer/scripts/e93_centered.py
      from ONE loaded model per corpus so the arms cannot drift:
        single    hard-chunked non-overlapping 256-char pieces (bench.predict_bares)
        vote      sliding window 256 / stride 128, majority, ties -> most central
        centered  sliding window 256 / stride 128, NO vote, most central window wins
      CORPORA (5): the registered gate {fadel_test, sadeed25, wikinews2014} plus
      wikinews2024 (unregistered) and abdou_test (the dev selector).
      WHY THIS SCRIPT AND NOT e94/e96: e93_centered.py reproduces the DEPLOYED
      mechanism by IMPORTING predict_marks / window_starts / _tie_break from
      e67_p6_vote.py rather than reimplementing them. It does NOT apply the
      nospace/base_only character deletion, so both models see the SAME raw-text

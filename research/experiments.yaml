        corpus          single     vote       centered
        fadel_test      0.071008   0.063742   0.063758
        sadeed25        0.151722   0.143746   0.143859
        wikinews2014    0.215848   0.205895   0.206333
        wikinews2024    0.404578   0.402035   0.402035
        gate_mean3      0.146193   0.137794   0.137983
      CENTERING VERDICT: ACCEPTED. The pre-registered bar was centered <= 0.98 * single =

      long does a restart buy? ORIGIN: E-080 concluded the state is a
      driver-level power-state latch that PERSISTS ACROSS PROCESSES, because the
      resumed arm C started already latched. The live E-079 arm A contradicts the
      permanent-latch reading: inside ONE process its per-1000-step rate
      alternates between ~22 s/100 and ~74.5 s/100, so the clock RE-ENTERS the

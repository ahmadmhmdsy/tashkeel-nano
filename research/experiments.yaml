  - id: diacritizer/E-076
    scope: diacritizer
    status: closed
    question: >-
      E-073 showed that a UNIFORM mean of the 12 C4b probes beats the best
      single probe by 6.03 percent on the registered gates and 6.96 percent on
      held-out abdou_test. But uniform weights were an unexamined choice: every
      member received equal mass regardless of its own quality, and the spread
      across the 12 probes is not small (abdou der 0.374565 to 0.394683, a 5.4

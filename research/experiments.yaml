  - id: diacritizer/E-090
    scope: diacritizer
    status: closed
    question: >-
      The registered metric compares a NON-NFC prediction against an NFC
      reference. bench.load_pairs normalizes EVERY reference to NFC (fadel line
      114, abdou 125, sadeed 134, wikinews 152), while the decoder
      (labels.marks_for_label via bench.diacritize_piece) emitted shadda-first

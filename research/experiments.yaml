  - id: diacritizer/E-100
    scope: diacritizer
    status: accepted
    dates: {opened: 2026-10-13, closed: 2026-10-14}
    owner: agent
    depends_on: [diacritizer/E-094, diacritizer/E-095, diacritizer/E-097, diacritizer/E-098]
    question: >-
      Is the published model (https://huggingface.co/ahmadsy/tashkeel-nano-4p5m, which is
      this project's OWN runs/diac/e63s_s4_12l160) being compared FAIRLY against E-097
      arm B? E-098's exploratory arm scored the published model on RAW TEXT and reported
      arm B winning by -64.01 pct on gate_mean3, but flagged as caveat (i) that the
      published model is subject to the E-094/E-095 whitespace mismatch and therefore
      deserves the nospace decode before that gap is treated as final. That re-decode has
      NOT yet been run.
    preregistration: >-
      Written BEFORE the run. WHY THE MISMATCH APPLIES, re-measured 2026-10-13 rather
      than assumed: space-token (space_id 77) counts in the first 200 rows of each bed are
        data/diac/v3/tokens/train_ids.npy       0 space tokens in 51200 positions
        data/diac/v3ctx256/tokens/train_ids.npy 0 space tokens in 51200 positions
        data/diac/v3full/tokens/train_ids.npy   7823 / 51200 = 15.28 pct
      The published model's config says tokens_phase v3, a bed with NO space tokens, so
      its space embedding row is never trained and raw-text decode feeds it an untrained
      embedding - exactly the E-094 condition. This also explains E-097's otherwise
      puzzling decode INVERSION cleanly: the nospace fix helps a no-space bed and destroys
      a v3full bed (arm B, +334.30 pct on abdou), because v3full has 15.28 pct real space
      tokens and stripping them is the mismatch there. The fix is PHASE-SPECIFIC, not a
      property of the decoder.
      MODEL: runs/diac/e63s_s4_12l160/final/model.pt with final/config.yaml (ctx 128,
      12L/160h/640ffn, 2 KV heads, 4488160 params, tokens_phase v3).
      DECODE (4 arms, ONE script, ONE loaded model per corpus),
      diacritizer/scripts/e100_nospace_batch.py - e94_nospace.py's 2x2 factorial:
        single            raw text, hard-chunked 128
        nospace           whitespace stripped before encode, marks reinserted at the
                          ORIGINAL character positions (e94's skip_ws rule)
        centered          sliding window 128 / stride 64, raw text, most central wins
        nospace_centered  sliding window 128 / stride 64, whitespace stripped
      Window 128 / stride 64 because this model's ctx is 128, NOT the 256 used for bed B.
      WHY A NEW SCRIPT: e94_nospace.py predicts ONE sentence per forward pass, the same
      batch-1 pathology E-099 fixed. The new script reuses e99_batch_decode.py's batching
      convention (length-sorted groups, bool padding mask True = KEEP) and IMPORTS its
      assemble(), so the vote/centered tie-break is the original code, not a
      reimplementation. The only new logic is strip-before-encode plus the position map
      back onto the original piece, which keeps the per-window mark list aligned to the
      original positions that assemble() indexes.
      CORPORA (4): the three registered gate corpora plus wikinews2024.
      HARNESS VALIDATION: arm 'single' must reproduce the E-098 exploratory arm's
      published-model numbers (fadel 0.313075, sadeed25 0.433694, wn2014 0.471891,
      wn2024 0.557460, gate_mean3 0.406220). Those came from the registered scorer over
      the model's own gate_probe/step19500 predictions, so agreement is required; if it
      does not reproduce, the run is INSTRUMENT-UNKNOWN and no arm is declared.
      AMENDMENT, recorded 2026-10-14 AFTER the run and never silently: that reference is
      a STALE ARTIFACT produced by a decoder that predates the NFC mark-order fix, so it
      is not a valid instrument. The replacement reference and the evidence are in the
      RESULT block below; the original rule is left standing here so the change of
      reference is auditable.
      COST: inference only, about 2-3 minutes of GPU for all four corpora at the measured
      batched rate. GPU is NOT free at registration - E-099 owns it - so this is queued
      until E-099 exits. No new checkpoints.
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL (fadel_test,
      sadeed25, wikinews2014) with research/verdict_audit/tools/e95_gate_score.py over the
      four arms.
      PRE-REGISTERED VERDICT RULES, fixed before launch.
      (1) FAIR DECODE: the published model's fair decode is the arm with the lowest
          gate_mean3 of the four. Reported, not ruled.
      (2) HEAD-TO-HEAD on the fair decode: arm B still WINS iff
          published_fair_gate_mean3 >= 0.98 * armB_centered (0.137983), i.e. iff the gap
          is at least 2 pct. NARROWED-BUT-HELD if the published model improves but stays
          at least 2 pct worse; REVERSED if it overtakes arm B.
      (3) PARAMETER EFFICIENCY, reported not ruled: arm B is 1083328 params vs the
          published model's 4488160, a 4.14x ratio.
      (4) Reported but NOT a rule: the published card's own headline comparison is STALE.
          Its '30 M deployed gold' is stage2b2500 (30.1 M params, 3-gate mean 42.63 on the
          card's x100 scale), whereas the current deployed anchor
          runs/diac/e73_soup/c4b_uniform is 1.08 M params / 0.159495, i.e. 15.95 on that
          same scale - so the card compares against a superseded baseline.
      RESULT, recorded 2026-10-14. The ORIGINAL reference did NOT reproduce: arm 'single'
      returned fadel 0.197030 against the required 0.313075. The gap was diagnosed to root
      cause instead of being declared INSTRUMENT-UNKNOWN, and the validation was amended.
      DIAGNOSIS. This script's single-arm output and the reference file
      (runs/diac/e63s_s4_12l160/gate_probe/step19500_fadel_test_pred.txt, byte-identical to
      runs/diac/e98_published/fadel_test/fadel_test.single.txt) differ in 1247905 of
      1753582 bytes, yet per-line character MULTISETS are identical for 1991 of the first
      2000 differing lines, macro_f1 agrees to 4 decimals and der_canonical agrees to 5.
      The difference is purely the ORDER of combining marks. The reference renders a
      geminate as U+0651 shadda THEN U+064E fatha; every current harness path - this
      script, e99_batch_decode.py, all 12 e98_centered probes, the e97 armA/armB
      gate_probe files, and the gold references themselves - renders U+064E THEN U+0651,
      i.e. Unicode NFC (fatha ccc 30 sorts before shadda ccc 33).
      ROOT CAUSE, already documented in code. diacritizer/src/labels.py:77-84 carries the
      fix note verbatim: the harness NFC-normalized every reference while the decoder did
      not normalize its own output, so the two were compared raw; a shadda-first render
      disagrees with every NFC reference on every geminate, measured at 4.5 pct of all
      units and 42 pct of the registered gate. labels.py was fixed 2026-10-11 20:38. The
      reference file is dated 2026-09-24 18:39, 17 days BEFORE that fix, so it carries the
      full pre-fix penalty.
      AMENDED VALIDATION. The reference is replaced by a decode from the harness this line
      already trusts: e99_batch_decode.py on the same checkpoint, window 128 / stride 64,
      scored by the same registered scorer, gives fadel_test single 0.197014 and centered
      0.183384. This script returns 0.197030 and 0.183384 - agreement to 1.6e-05 on single
      and EXACT on centered. The instrument is VALIDATED and all four arms are declared.
      RESULTS, gate_mean3 over fadel_test / sadeed25 / wikinews2014, lower better:
        single            0.287682   fadel 0.197030  sadeed25 0.302952  wn2014 0.363065
        nospace           0.246228   fadel 0.158867  sadeed25 0.243110  wn2014 0.336706
        centered          0.273375   fadel 0.183384  sadeed25 0.288058  wn2014 0.348682
        nospace_centered  0.228984   fadel 0.142968  sadeed25 0.225872  wn2014 0.318112
      wikinews2024, unregistered: single 0.511775, nospace 0.486530, centered 0.507442,
      nospace_centered 0.480501.
      RULE (1) FAIR DECODE: nospace_centered at 0.228984.
      RULE (2) HEAD-TO-HEAD: arm B still wins iff published_fair >= 0.98 * 0.137983 =
      0.135223. 0.228984 clears that, so arm B WINS on the fair decode. The E-094/E-095
      whitespace mismatch was real and worth -20.40 pct on gate_mean3 (single to nospace,
      0.287682 -> 0.246228), but it does not close the gap.
      RULE (3) PARAMETER EFFICIENCY: 1083328 vs 4488160 params; arm B is 4.14x smaller.
      RULE (4) CARD HEADLINE STALE: CONFIRMED, and now root-caused - the card's published
      numbers came from the pre-fix renderer, so they are inflated by the geminate-order
      defect rather than by model quality.
      CORRECTED HEAD-TO-HEAD, NFC on BOTH sides. Published model, best own fair decode
      0.228984. armB_30k centered 0.137983 -> -39.74 pct. E-099 soupB_uniform 0.115148 ->
      -49.71 pct. The E-098 exploratory figure of -64.01 pct in
      runs/diac/e98_published/comparison.md is WRONG: it compared an NFC arm-B decode
      against a pre-fix published decode, and that file now carries a correction banner.
      VERDICT: E-100 ACCEPTED. Arm B wins the fair head-to-head by -39.74 pct at 4.14x
      fewer parameters, the E-094/E-095 whitespace caveat is discharged, and the published
      card's headline is stale for a now-identified renderer reason.

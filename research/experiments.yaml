  - id: diacritizer/E-104
    scope: diacritizer
    status: accepted
    dates: {opened: 2026-10-14, closed: 2026-10-14}
    owner: agent
    depends_on: [diacritizer/E-100, diacritizer/E-103]
    question: >-
      Both published model cards compared the published models against LOCAL,
      UNPUBLISHED checkpoints. User-reported 2026-10-14: "i noticed that in both
      published repo that you compare with our local in the hub and imagine me as view
      it from other machine i have no idea what other mode you are compare with them (
      as they are not published ), and this wrong . only compare with available model (
      like our published or SOTA model that have been published by other )". An outside
      reader cannot download or verify an internal checkpoint, so every such row was
      unverifiable. Scope: rewrite both cards so every comparison is against a
      DOWNLOADABLE model (our own published repos or a published third-party
      leaderboard), and record the correction.
    preregistration: >-
      Recorded as a CORRECTION action, not a hypothesis test: no measurement arm, no
      GPU training, no new model. Two things had to be settled before writing:
        (1) WHICH public benchmark can carry the comparison. Chosen before any number
            was computed: SadeedDiac-25 (Misraj/SadeedDiac-25), because it is
            downloadable, it ships gold, and it ships a PUBLISHED leaderboard of
            third-party systems, so a reader can reproduce the whole table; and
        (2) whether the published metric is comparable. This was checked FIRST and it
            was not. Our der_registered is WORD-level; the benchmark's DER (CE) is
            DIACRITIC/letter-level and its WER (CE) is the word-level analogue, so our
            11.71 must not be placed beside their 7.29.
      MARK-ORDER RULE, fixed before scoring because E-100 had already proved the defect
      is decisive. SadeedDiac-25's gold is SHADDA-FIRST (U+0651 then U+064E) and 176 of
      200 sampled gold rows are NOT NFC; the benchmark's evaluator drops a shadda that
      follows a vowel (labels.py:77-84 documents the same failure mode). Our published
      1p1m package emits NFC (fatha then shadda). Therefore BOTH readings are reported
      and neither is hidden: AS-EMITTED (literal - what the evaluator does to our raw
      output) and ORDER-NORMALISED (our output rewritten to the benchmark's
      shadda-first order, comparing linguistic content like-for-like).
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL (fadel_test,
      sadeed25, wikinews2014). This record adds a SECOND, public surface; it does not
      replace the registered one.
      BENCHMARK: SadeedDiac-25, all 1200 paragraphs, scored with the benchmark authors'
      own evaluator (misraj-ai/Sadeed Eval_code.ipynb,
      gt_missing_diacritic_is_error=False). 1200 of 1200 scored, 0 skipped, for every
      model - no silent sentence loss.
      RESULTS, DER (CE) / WER (CE) / DER (w/o CE) / WER (w/o CE), lower better:
        tashkeel-nano-1p1m  as emitted (NFC)  8.78 / 31.14 /  6.19 / 22.73
        tashkeel-nano-1p1m  order-normalised  3.78 / 12.73 /  2.25 /  7.41
        tashkeel-nano-4p5m  as published      9.91 / 31.03 /  5.01 / 15.73
      The 4p5m figures are IDENTICAL under both readings because that package still
      ships the PRE-NFC renderer and therefore already emits shadda-first - measured,
      not assumed. Its published number is therefore unaffected by the order artifact,
      while the 1p1m number moves by a factor of 2.3 on DER (CE).
      RANKING, 1p1m order-normalised against the 11 published leaderboard systems:
      3rd of 11 on DER (CE) (behind Claude-3.7-Sonnet 1.39 and Gemini-Flash-2.0 3.19,
      ahead of GPT-4 3.86 and the dedicated 1.5B Sadeed model 7.29); 2nd on DER (w/o
      CE) at 2.25 (ahead of Gemini 2.38, GPT-4 3.86, Sadeed 5.26); 4th on WER (CE);
      3rd on WER (w/o CE). 4p5m ranks 6th of 12 on DER (CE), ahead of every 7B-13B
      system.
      CAVEAT RECORDED, NOT HIDDEN: the benchmark does not state whether the systems on
      its leaderboard were scored with or without mark-order normalisation, so the
      ranking is presented as approximate on both cards.
      WHAT WAS REMOVED. 1p1m card: the E-097 arm B @ 30k and deployed gold
      e73_soup/c4b_uniform rows, the 12-probe soup table, the Correction rows naming
      arm B and deployed gold, and the internal-path Reproduction section. 4p5m card:
      the headline beats-the-30M-deployed-gold claim, the 17.2M champion M1 row, the
      stage2b2500 deployed-gold row, all six E-63s sweep arms, the internal arms in the
      WikiNews-2024 table, and the E-63s sweep table itself. The WikiNews-2024
      model-index metric (DER 1.77, in-domain/contaminated) was replaced by the
      SadeedDiac-25 DER (CE) metric on both cards.
      RETRACTIONS PUBLISHED, because a stale number already in the wild must be named:
      the 1p1m card keeps a labelled retraction of the earlier -64.01 pct figure; the
      4p5m card keeps a labelled retraction of its own earlier 31.31 / 43.37 / 47.19
      (mean 40.62) table, with the corrected 19.70 / 30.30 / 36.31 (28.77) single-arm
      values and the 14.30 / 22.59 / 31.81 (22.90) fair-decode values beside it.
      VERDICT: E-104 ACCEPTED. Both cards compare only against downloadable models,
      both carry the mark-order caveat, and both round-trip byte-identical from the Hub.
    evidence: >-
      runs/diac/e98_soupB/release/README.md (rewritten 1p1m card, 12668 B, 314 lines);
      research/model_cards/tashkeel-nano-1p1m.md and research/model_cards/tashkeel-nano-4p5m.md (durable copies of both rewritten cards); scratch/e104_4p5m_card_new.md (rewritten 4p5m card, 16346 B, 386 lines);
      scratch/e104_predict.py; scratch/e104_score.py; scratch/e104_pred_1p1m.json;
      scratch/e104_pred_4p5m.json; scratch/e104_sadeed_results.json;
      scratch/e104_cardcheck.py; scratch/e104_upload_cards.py; scratch/e104_verify_cards.py;
      scratch/e103_nb_cell3.py (verbatim benchmark evaluator);
      data/diac/raw/sadeed_25/sadeed25.parquet (the benchmark, 1200 rows);
      runs/diac/e100_published_nospace/<corpus>/score_registered.json (4p5m fair decode);
      runs/diac/e98_centered/soupB_uniform/<corpus>/score_registered.json (1p1m registered);
      https://huggingface.co/ahmadsy/tashkeel-nano-1p1m/commit/a60baf8f507935a85b2fbaa3221736a0bf37fd71;
      https://huggingface.co/ahmadsy/tashkeel-nano-4p5m/commit/c8bd62b4f2f3d98b6985d0bef92825183e7e164f.
  - id: diacritizer/E-105
    scope: diacritizer
    status: accepted
    dates: {opened: 2026-10-14, closed: 2026-10-14}
    owner: agent
    depends_on: [diacritizer/E-103, diacritizer/E-104]
    question: >-
      User-directed 2026-10-14: "also create a space to use/test our model and other SOTA
      model so user can see its result ( show off our ) and compare it with other model .
      also in the space allow the user to past/upload bigger input and the space can split

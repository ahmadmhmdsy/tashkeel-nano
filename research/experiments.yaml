      FINDING 2026-10-05 (voids E066-G4) - the stage1lm warm-start is a 100
      percent SILENT NO-OP for the 64-hidden s7 architecture. R1's own launch
      print reads tensors_in 255, missing 165, unexpected 0, shape_skipped 255,

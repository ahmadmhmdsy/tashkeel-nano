      - diacritizer/E-074
    arms: >-
      No training. (1) GREEDY ARM: Caruana-style greedy soup selection WITH
      replacement over the 12 c4b probes, R=4 rounds. At each round every probe
      is tried as one extra unit of weight on top of the running count vector,
      the candidate is scored by der_registered on the abdou_test DEV subsample
      (single pass, --limit 4000), and the argmin takes the unit. The final
      soup is the count-weighted fp32 mean of member state dicts, cast back to
      the members' dtype and saved in the same {model, step, config} wrapper
      shape as the E-073 soups, so the existing eval path loads it unchanged.
      (2) REFERENCE ARM, already measured: the uniform c4b soup of E-073/E-075.

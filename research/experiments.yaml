      (+9.4 percent), with the effect living in long sentences. Note the vote gain
      can only exist where a sentence has MORE THAN ONE window, i.e. where the
      sentence is longer than the window. Does raising the voting window to
      512/stride 256 - which both lets a long sentence be seen as one context and
      keeps overlap voting - COMPOSE with the E-075 soup?

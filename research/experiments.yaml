      (1395 MHz / 81.42 W) about 7 min after arm C's process exited, which is a
      second, uncontrolled observation that a fresh process can start fast. So
      the latch model is incomplete: the state is neither permanently sticky nor
      purely process-scoped, and the trigger is not isolated. This is a
      THROUGHPUT / MECHANISM experiment. It produces no model candidate and no
      new best; its only output is knowledge about the clock state and, if the
      restart turns out to clear it, a possible budget mitigation.

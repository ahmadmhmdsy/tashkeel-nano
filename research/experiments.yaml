      raw/wikinews/wikinews2024_multi_ref.diac as a training source while that
      same file IS the wikinews2024 gate benchmark (bench.py:147,
      eval_e63s_wn2024.py:22), so any corpus built with the default --sources
      trains on a test set. The v3 corpus carries NO wikinews2024 windows: it
      was rebuilt with --sources excluding it, and its prepare_stats.json

        S64  (4 votes/position)  0.188517   -0.23 pct relative
        S32  (8 votes/position)  0.188566   -0.21 pct relative
      MARGINAL-RETURN CURVE, same 400 pairs, single arm scored from the SAME
      run's invariant single output (e67_p6_vote.py:149):
        single pass, full ctx        0.198411
        1 -> 2 votes (S128)          0.188956   -4.77 pct relative
        2 -> 4 votes (S64)           0.188517   -0.23 pct relative
        4 -> 8 votes (S32)           0.188566   -0.21 pct relative
      So the FIRST re-decode buys -4.77 pct and the next three doublings buy
      -0.23 and -0.21 pct: the marginal effect of a further vote is about 23x
      SMALLER than the first one. The gain is a ONE-TIME correction, not an
      accumulation. That is the mechanism, and it is what a genuine
      outvote-independent-errors story would NOT look like: if extra contexts
      contributed independent evidence, the curve would keep falling instead of
      saturating immediately after the first one.
      CALIBRATION OF THE PREFIX (both arms, against full-corpus artifacts): single
      0.198411 here vs 0.198883 full (0.24 pct gap); vote 0.188956 here vs
      0.188487 full (0.25 pct gap). The 400-pair prefix is representative for both
      arms and the -4.77 pct prefix gap matches the -5.23 pct full-corpus gap.
      PAIRED exact McNemar against S128 on the SAME lines:
        S64  discordant 192 (S128-only 87,  S64-only 105)  p = 0.220
        S32  discordant 252 (S128-only 118, S32-only 134)  p = 0.345
      PRE-REGISTERED RULE -> INCONCLUSIVE on BOTH arms: neither denser stride
      reaches the 2 pct bar and neither reaches p < 0.05. VERDICT none - the
      screen makes no claim it can support. Neither denser arm is promoted, so
      the deployed setting stays W256/128.
      SCREEN VALIDITY (checked, not assumed). (a) All three arms decoded the same
      lines and the scorer refuses to compare otherwise. (b) The stride-128
      control reads 0.188956 on this 400-pair prefix against E-090's FULL-corpus
      abdou vote of 0.188487 - a 0.25 pct gap - so the prefix is representative
      and the screen is calibrated against a full-gate artifact rather than
      floating free. (c) The 1065 "lines" the scorer counts are line-SEGMENTS:
      abdou_test gold fields contain embedded newlines and the tool reads with
      splitlines(), the same caveat E-088 recorded. Word-level DER is unaffected
      by line grouping, and the non-degeneracy gate PASSED.
      WHAT THIS CLOSES, STATED NARROWLY. E-077 framed its window sweep as testing
      whether "shrinking the window mechanically raises the number of independent
      contexts each position is voted from", but it always held stride = window/2,
      so EVERY interior position had EXACTLY 2 covering windows at every window
      size it tried. E-092 is the first run to vary that number, and the answer is
      that it does not matter: quadrupling the covering windows (2 -> 8) moves DER
      by about 0.2 pct, an order of magnitude below the 2 pct bar. Overlapping
      windows of ONE DETERMINISTIC MODEL are therefore NOT decorrelated - adjacent
      windows see nearly the same context and repeat the same mistakes. E-075's
      -3.71 pct gain is a context-mixing effect that is already SATURATED at 2
      votes; it is not evidence that more votes buy more.
      WHAT THIS DOES NOT CLOSE. E-088 named the surviving route precisely: a
      candidate set whose errors are NOT the same errors, i.e. a word-level or
      variable-length model TRAINED FROM SCRATCH. E-092 tests cheap re-decoding of
      the SAME checkpoint and says nothing about a different model's errors. That
      training arm remains the one unrun decorrelation candidate, and this result
      raises its price honestly: decorrelation must come from a DIFFERENT model,
      because it cannot be harvested from the same one.
      AMENDED (same session, post-hoc on these artifacts): see the amendment field.
      The mechanism is CENTERED-CONTEXT SELECTION at hard 256-char chunk boundaries,
      and 91.8 pct of the gain is words within 8 chars of one; the vote is a repair
      of our own chunking and is VOID as evidence that combining models works.

    amendment: >-
      AMENDED 2026-10-11, same session, POST-HOC ANALYSIS OF THE SAME E-092
      ARTIFACTS - no new model runs, no GPU. The finding above attributes the
      vote's gain to "context mixing ... already saturated at 2 votes". That is
      true but VAGUE, and the precise mechanism is sharper and changes how E-075
      must be read. research/verdict_audit/tools/boundary_decomposition.py buckets
      every word by its character distance to the nearest multiple of 256 - the
      hard chunk boundary bench.predict_bares creates through
      chunks_of(bare, ctx) (diacritizer/scripts/bench.py:52-53) - and measures both
      arms per bucket on the same 400 pairs:
        distance   words   single err   vote err   reduction
        0-8         3092     0.3325      0.2170     357.0
        9-16        2628     0.2013      0.1979       9.0
        17-32       5298     0.1965      0.1950       8.0
        33-64      10312     0.1937      0.1910      27.0
        65+        19689     0.1810      0.1816     -12.0
      READINGS, computed rather than eyeballed:
        - Words within 8 chars of a chunk boundary are wrong 33.25 pct of the time
          against 18.10 pct for interior words: an 83.7 pct relative excess. The
          "single" arm is NOT a full-sentence decode. It is a NON-OVERLAPPING
          256-char chunked decode, and its boundaries are a self-inflicted artifact.
        - That bucket is 7.5 pct of the words and supplies 91.8 pct of the vote's
          ENTIRE error reduction (357 of 389 errors). Buckets 9-64 supply 2.3, 2.1
          and 6.9 pct, and the interior bucket supplies MINUS 3.1 pct: on words far
          from any boundary the vote is very slightly WORSE (0.1816 vs 0.1810).
        - The vote repairs the 0-8 bucket by 34.7 pct relative and leaves only
          0.27 pct DER of residual boundary excess, so the artifact is nearly fully
          fixed and there is no meaningful headroom left in it.
      THE MECHANISM IS CENTERED-CONTEXT SELECTION, NOT CONTEXT MIXING. At stride
      128 a boundary word is covered by exactly two windows and is interior in one
      of them; the middle-context tie-break (e67_p6_vote.py:_tie_break) is what
      picks it. That single fact explains the whole E-092 curve above: coverage is
      already complete at 2 votes, so density buys nothing, and the -4.77 pct is a
      boundary repair that is already 91.8 pct done.
      CONSEQUENCE FOR E-075 AND E-091, and this is the part that matters. E-091
      calls sliding-window voting "the only mechanism with a measured significant
      effect" and reads it as a COMBINATION result. It is not one. It is a repair
      of our own chunking, and as evidence that combining models works it is VOID.
      What survives as a combination claim is nothing: the ensemble/merge axis
      (E-078, E-083) is independently rejected.
      OPEN QUESTION, RESOLVED BY E-093 (same session): the clean OVERLAPPING decode
      with NO vote - the single most-central window per position - was run and it
      MATCHES the vote. E-093 measured vote 0.188956 vs centered 0.189054, a
      +0.05 pct gap on 24 discordant words out of 41019 (p = 0.541), while centering
      alone reproduces -4.72 pct of the -4.77 pct attributed to voting. THE VOTE IS
      REDUNDANT: the majority step is worth four words in 41019. The mechanism is
      pure CENTERED-CONTEXT SELECTION, and the honest single-arm baseline is the
      centered/overlapping decode (0.1890), not the hard-chunked single (0.1984).


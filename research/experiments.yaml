      - runs/v2/core/micro_full/status.json
      - runs/v2/core/micro_full/train/checkpoints/COMPLETE.json
      - runs/v2/core/micro_full/internal_evaluation/evaluations/COMPLETE.json
      - runs/v2/core/micro_full/internal_evaluation/evaluations/generation/report.json
      - runs/v2/core/micro_full/external_gates/reports/COMPLETE.json
      - runs/v2/core/micro_full/publish_final/COMPLETE.json

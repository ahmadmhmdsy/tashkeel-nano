      Evidence: runs/diac/e98_published/comparison.md and
      runs/diac/e98_published/<corpus>/score_registered.json;
      runs/diac/e63s_s4_12l160/gate_probe/step19500_<corpus>_pred{,.ref}.txt.
    gates: >-
      Registered metric unchanged: mean der_registered over GATE_EXTERNAL
      (fadel_test, sadeed25, wikinews2014), scored with the registered scorer
      research/verdict_audit/tools/e95_gate_score.py --arms single,vote,centered.
      Dev selector: abdou_test der_registered, as in E-097.
      PRE-REGISTERED VERDICT RULES, fixed before running.
      (1) CENTERING, evaluated separately for each model: centered is ACCEPTED iff
      centered <= 0.98 * single on gate_mean3 - the same 2 pct relative bar E-093 and
